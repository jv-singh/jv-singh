name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          config: |
            base: header, repositories, languages
            base.indepth: true
            header.actions: true
            languages.analysis: true
            languages.details: bytes-size, lines
            languages.colors: github
            languages.limit: 8
            repositories.batch_size: 8
            repositories.limit: 4
            output: markdown
          outputs:
            summary: summary.md
            metrics: github-metrics.md
            software: github-metrics.svg
            activity: github-metrics-activity.svg
            languages: github-metrics-languages.svg
            followup: github-metrics-followup.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
