<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mottoG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#footerBg)"/>

  <!-- Decorative top line -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <circle cx="200" cy="20" r="3" fill="#6366f1"/>
  <circle cx="600" cy="20" r="3" fill="#3b82f6"/>
  <circle cx="1000" cy="20" r="3" fill="#10b981"/>

  <!-- Quote -->
  <text x="600" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" fill="#cbd5e1" font-style="italic" opacity="0.9">"Code. Learn. Build. Repeat."</text>

  <!-- Hero motto -->
  <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="56" font-weight="800" fill="url(#mottoG)" filter="url(#fGlow)" letter-spacing="-1">Let's Make It Exist.</text>

  <!-- Sub -->
  <text x="600" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b" letter-spacing="4">ENGINEERING IDEAS INTO REALITY</text>

  <!-- Bottom signature -->
  <text x="600" y="275" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">© 2026 · Jaivardhan Singh · Built with ❤ and AI</text>
</svg>
