<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="satellite icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- satellite body -->
    <rect x="26" y="26" width="12" height="14" rx="2"/>
    <!-- solar panels -->
    <rect x="6"  y="30" width="16" height="6"/>
    <rect x="42" y="30" width="16" height="6"/>
    <line x1="10" y1="30" x2="10" y2="36"/>
    <line x1="14" y1="30" x2="14" y2="36"/>
    <line x1="18" y1="30" x2="18" y2="36"/>
    <line x1="46" y1="30" x2="46" y2="36"/>
    <line x1="50" y1="30" x2="50" y2="36"/>
    <line x1="54" y1="30" x2="54" y2="36"/>
    <!-- antenna -->
    <line x1="32" y1="26" x2="32" y2="14"/>
    <circle cx="32" cy="12" r="2" fill="url(#g)"/>
    <!-- signal waves -->
    <path d="M20 50 Q32 56 44 50" stroke-dasharray="2 3"/>
    <path d="M16 56 Q32 64 48 56" stroke-dasharray="2 3" opacity="0.5"/>
  </g>
</svg>
