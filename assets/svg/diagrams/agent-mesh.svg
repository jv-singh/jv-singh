<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Multi-Agent Mesh Diagram">
  <title>Multi-Agent Mesh</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#020617"/></radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .flow { stroke-dasharray: 4 6; animation: f 3s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="800" height="480" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="440" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ MULTI-AGENT MESH · A2A + MCP</text>
  <text x="760" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">8 NODES · COORDINATED</text>

  <g transform="translate(400,260)">
    <!-- Connections mesh -->
    <g fill="none" stroke="url(#g1)" stroke-width="1" class="flow" opacity="0.7">
      <line x1="-260" y1="-120" x2="-90" y2="-40"/>
      <line x1="-90" y1="-40" x2="100" y2="-90"/>
      <line x1="100" y1="-90" x2="240" y2="20"/>
      <line x1="-260" y1="-120" x2="-180" y2="80"/>
      <line x1="-180" y1="80" x2="0" y2="40"/>
      <line x1="0" y1="40" x2="100" y2="-90"/>
      <line x1="0" y1="40" x2="240" y2="20"/>
      <line x1="0" y1="40" x2="160" y2="140"/>
      <line x1="-180" y1="80" x2="-220" y2="160"/>
      <line x1="-220" y1="160" x2="0" y2="40"/>
      <line x1="240" y1="20" x2="160" y2="140"/>
      <line x1="160" y1="140" x2="40" y2="180"/>
    </g>

    <!-- Agents -->
    <g filter="url(#b)">
      <g transform="translate(-260,-120)"><circle r="14" fill="#22d3ee"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">PL</text></g>
      <g transform="translate(-90,-40)"><circle r="14" fill="#a78bfa"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">RT</text></g>
      <g transform="translate(100,-90)"><circle r="14" fill="#ec4899"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">TL</text></g>
      <g transform="translate(240,20)"><circle r="14" fill="#10b981"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">EX</text></g>
      <g transform="translate(-180,80)"><circle r="14" fill="#f59e0b"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">CR</text></g>
      <g transform="translate(0,40)">
        <circle r="22" fill="#0a0a1a" stroke="url(#g2)" stroke-width="2"/>
        <circle r="14" fill="url(#g2)" opacity="0.5"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#22d3ee" font-weight="700">ORC</text>
        <circle r="6" fill="#22d3ee" class="pulse"/>
      </g>
      <g transform="translate(160,140)"><circle r="14" fill="#22d3ee"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">MM</text></g>
      <g transform="translate(-220,160)"><circle r="14" fill="#a78bfa"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">EV</text></g>
      <g transform="translate(40,180)"><circle r="14" fill="#ec4899"/><text text-anchor="middle" y="3" class="mono" font-size="8" fill="#0a0a1a" font-weight="700">AU</text></g>
    </g>

    <!-- Labels -->
    <g class="mono" font-size="9" fill="#cbd5e1" text-anchor="middle">
      <text x="-260" y="-135">planner</text>
      <text x="-90" y="-55">retriever</text>
      <text x="100" y="-105">tool-user</text>
      <text x="240" y="35">executor</text>
      <text x="-180" y="95">critic</text>
      <text x="0" y="80">orchestrator</text>
      <text x="160" y="155">memory</text>
      <text x="-220" y="175">evaluator</text>
      <text x="40" y="195">audit</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(40,420)" class="mono" font-size="9" fill="#64748b">
    <text>▸ A2A · agent-to-agent messages</text>
    <text x="280">▸ MCP · shared tool surface</text>
    <text x="540" fill="#22d3ee">● live mesh</text>
  </g>
</svg>