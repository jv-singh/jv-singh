<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Agentic RAG Pipeline Architecture">
  <title>Agentic RAG Pipeline — Architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0a0a1a"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .flow { stroke-dasharray: 8 6; animation: f 2s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -300; } }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="420" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ AGENTIC RAG PIPELINE · LIVE ARCHITECTURE</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">v2.0 · MULTI-HOP</text>

  <!-- Top layer — query → plan -->
  <g transform="translate(60,90)">
    <rect width="240" height="80" rx="6" fill="#022c22" stroke="#10b981"/>
    <text x="120" y="28" text-anchor="middle" class="mono" font-size="11" fill="#10b981" letter-spacing="2">USER QUERY</text>
    <text x="120" y="50" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">natural language input</text>
    <text x="120" y="66" text-anchor="middle" class="mono" font-size="9" fill="#64748b">stream · tokens · history</text>
  </g>

  <!-- Planner / orchestrator -->
  <g transform="translate(360,80)">
    <rect width="240" height="100" rx="6" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="120" y="28" text-anchor="middle" class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">PLANNER · AGENT</text>
    <text x="120" y="50" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">decompose · choose tool</text>
    <text x="120" y="68" text-anchor="middle" class="mono" font-size="9" fill="#a78bfa">LangGraph · ReAct</text>
    <circle cx="220" cy="20" r="3" fill="#22d3ee" class="pulse"/>
  </g>

  <!-- Tools row -->
  <g transform="translate(660,70)">
    <rect width="480" height="120" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="22" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▌ TOOLKIT</text>

    <!-- Tool 1 -->
    <g transform="translate(20,40)">
      <rect width="140" height="60" rx="4" fill="#022c22" stroke="#10b981"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="10" fill="#10b981">VECTOR SEARCH</text>
      <text x="70" y="40" text-anchor="middle" class="mono" font-size="8" fill="#64748b">top-k · rerank · hybrid</text>
      <text x="70" y="52" text-anchor="middle" class="mono" font-size="8" fill="#22d3ee">Pinecone · bge-large</text>
    </g>
    <!-- Tool 2 -->
    <g transform="translate(170,40)">
      <rect width="140" height="60" rx="4" fill="#022c22" stroke="#a78bfa"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="10" fill="#a78bfa">SQL ANALYST</text>
      <text x="70" y="40" text-anchor="middle" class="mono" font-size="8" fill="#64748b">read-only · structured</text>
      <text x="70" y="52" text-anchor="middle" class="mono" font-size="8" fill="#22d3ee">SQL · Postgres</text>
    </g>
    <!-- Tool 3 -->
    <g transform="translate(320,40)">
      <rect width="140" height="60" rx="4" fill="#022c22" stroke="#ec4899"/>
      <text x="70" y="22" text-anchor="middle" class="mono" font-size="10" fill="#ec4899">WEB SEARCH</text>
      <text x="70" y="40" text-anchor="middle" class="mono" font-size="8" fill="#64748b">live · cited</text>
      <text x="70" y="52" text-anchor="middle" class="mono" font-size="8" fill="#22d3ee">Tavily · Brave</text>
    </g>
  </g>

  <!-- Middle — vector store -->
  <g transform="translate(60,210)">
    <rect width="380" height="200" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="28" class="mono" font-size="11" fill="#a78bfa" letter-spacing="2">KNOWLEDGE CORE</text>

    <g transform="translate(20,50)">
      <text class="mono" font-size="9" fill="#64748b">VECTOR INDEX</text>
      <g transform="translate(0,16)">
        <ellipse cx="60" cy="40" rx="60" ry="40" fill="none" stroke="url(#g1)" stroke-width="1" filter="url(#b)"/>
        <ellipse cx="60" cy="40" rx="60" ry="40" fill="none" stroke="url(#g1)" stroke-width="1" stroke-dasharray="1 4"/>
        <g fill="#a78bfa">
          <circle cx="40" cy="30" r="2"/><circle cx="50" cy="50" r="2"/><circle cx="70" cy="20" r="2"/>
          <circle cx="80" cy="60" r="2"/><circle cx="60" cy="40" r="3" filter="url(#b)"/>
          <circle cx="30" cy="50" r="1.5"/><circle cx="100" cy="35" r="1.5"/>
        </g>
      </g>
      <text x="160" class="mono" font-size="10" fill="#cbd5e1">1024-dim embeddings</text>
      <text x="160" y="20" class="mono" font-size="10" fill="#cbd5e1">hybrid search · BM25</text>
      <text x="160" y="40" class="mono" font-size="10" fill="#cbd5e1">10K+ chunks</text>
    </g>

    <g transform="translate(20,140)">
      <text class="mono" font-size="9" fill="#64748b">MEMORY</text>
      <g transform="translate(0,16)">
        <rect width="320" height="30" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
        <text x="14" y="20" class="mono" font-size="10" fill="#94a3b8">user · session · episodic · semantic</text>
        <circle cx="310" cy="15" r="4" fill="#22d3ee" class="pulse"/>
      </g>
    </g>
  </g>

  <!-- Critic / Eval -->
  <g transform="translate(480,210)">
    <rect width="320" height="200" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="28" class="mono" font-size="11" fill="#ec4899" letter-spacing="2">CRITIC · EVAL LOOP</text>

    <g transform="translate(20,50)">
      <rect width="280" height="40" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
      <text x="14" y="18" class="mono" font-size="9" fill="#64748b">GROUNDED ?</text>
      <text x="14" y="32" class="mono" font-size="10" fill="#10b981">yes ✓</text>
    </g>
    <g transform="translate(20,100)">
      <rect width="280" height="40" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
      <text x="14" y="18" class="mono" font-size="9" fill="#64748b">HALLUCINATIONS ?</text>
      <text x="14" y="32" class="mono" font-size="10" fill="#10b981">none detected ✓</text>
    </g>
    <g transform="translate(20,150)">
      <rect width="280" height="36" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
      <text x="14" y="14" class="mono" font-size="9" fill="#64748b">CONFIDENCE</text>
      <rect x="14" y="20" width="240" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="14" y="20" width="220" height="6" rx="3" fill="url(#g2)"/>
    </g>
  </g>

  <!-- Output -->
  <g transform="translate(840,210)">
    <rect width="300" height="200" rx="6" fill="#0a0a1a" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="20" y="28" class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">FINAL ANSWER</text>

    <g transform="translate(20,50)">
      <text class="mono" font-size="10" fill="#94a3b8">// streamed · cited · grounded</text>
    </g>

    <g transform="translate(20,80)">
      <rect width="260" height="100" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
      <g class="mono" font-size="9" fill="#cbd5e1">
        <text x="14" y="20">Q: explain our Q3 strategy</text>
        <text x="14" y="40" fill="#22d3ee">A: based on the report [1]…</text>
        <text x="14" y="58" fill="#22d3ee">Q3 focused on three pillars…</text>
        <text x="14" y="76" fill="#a78bfa">[1] q3-strategy.pdf · p.4</text>
        <text x="14" y="92" fill="#a78bfa">confidence: 0.91</text>
      </g>
    </g>
  </g>

  <!-- Animated flow connectors -->
  <g fill="none" stroke="url(#g1)" stroke-width="1.6" class="flow" filter="url(#b)">
    <path d="M300 130 L360 130"/>
    <path d="M600 130 L660 130"/>
    <path d="M900 130 L1060 130"/>
    <path d="M780 190 L580 210"/>
    <path d="M820 300 L840 280"/>
  </g>

  <text x="40" y="430" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ PIPELINE  ·  query → plan → retrieve → critic → answer</text>
  <text x="1160" y="430" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">● LIVE · 24ms/turn</text>
</svg>