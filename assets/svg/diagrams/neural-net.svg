<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Neural Network Diagram">
  <title>Neural Network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0a0a1a"/></linearGradient>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="b"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .pulse { animation: p 1.6s ease-in-out infinite; }
      @keyframes p { 0%,100%{opacity:0.3} 50%{opacity:1} }
      .flow { stroke-dasharray: 2 4; animation: f 3s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="360" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ NEURAL NETWORK · TRANSFORMER-LIKE</text>
  <text x="560" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">5-6-6-6-4</text>

  <g transform="translate(300,210)">
    <circle r="160" fill="url(#g)" opacity="0.5"/>

    <!-- Connections (faint) -->
    <g stroke="#a78bfa" stroke-width="0.4" fill="none" opacity="0.35">
      <!-- input → hidden1 -->
      <line x1="-180" y1="-60" x2="-90" y2="-90"/>
      <line x1="-180" y1="-60" x2="-90" y2="-30"/>
      <line x1="-180" y1="-60" x2="-90" y2="30"/>
      <line x1="-180" y1="-60" x2="-90" y2="90"/>
      <line x1="-180" y1="-20" x2="-90" y2="-90"/>
      <line x1="-180" y1="-20" x2="-90" y2="-30"/>
      <line x1="-180" y1="-20" x2="-90" y2="30"/>
      <line x1="-180" y1="-20" x2="-90" y2="90"/>
      <line x1="-180" y1="20" x2="-90" y2="-90"/>
      <line x1="-180" y1="20" x2="-90" y2="-30"/>
      <line x1="-180" y1="20" x2="-90" y2="30"/>
      <line x1="-180" y1="20" x2="-90" y2="90"/>
      <line x1="-180" y1="60" x2="-90" y2="-90"/>
      <line x1="-180" y1="60" x2="-90" y2="-30"/>
      <line x1="-180" y1="60" x2="-90" y2="30"/>
      <line x1="-180" y1="60" x2="-90" y2="90"/>

      <!-- hidden1 → hidden2 -->
      <line x1="-90" y1="-90" x2="0" y2="-60"/>
      <line x1="-90" y1="-90" x2="0" y2="-20"/>
      <line x1="-90" y1="-90" x2="0" y2="20"/>
      <line x1="-90" y1="-90" x2="0" y2="60"/>
      <line x1="-90" y1="-30" x2="0" y2="-60"/>
      <line x1="-90" y1="-30" x2="0" y2="-20"/>
      <line x1="-90" y1="-30" x2="0" y2="20"/>
      <line x1="-90" y1="-30" x2="0" y2="60"/>
      <line x1="-90" y1="30" x2="0" y2="-60"/>
      <line x1="-90" y1="30" x2="0" y2="-20"/>
      <line x1="-90" y1="30" x2="0" y2="20"/>
      <line x1="-90" y1="30" x2="0" y2="60"/>
      <line x1="-90" y1="90" x2="0" y2="-60"/>
      <line x1="-90" y1="90" x2="0" y2="-20"/>
      <line x1="-90" y1="90" x2="0" y2="20"/>
      <line x1="-90" y1="90" x2="0" y2="60"/>

      <!-- hidden2 → hidden3 -->
      <line x1="0" y1="-60" x2="90" y2="-90"/>
      <line x1="0" y1="-60" x2="90" y2="-30"/>
      <line x1="0" y1="-60" x2="90" y2="30"/>
      <line x1="0" y1="-60" x2="90" y2="90"/>
      <line x1="0" y1="-20" x2="90" y2="-90"/>
      <line x1="0" y1="-20" x2="90" y2="-30"/>
      <line x1="0" y1="-20" x2="90" y2="30"/>
      <line x1="0" y1="-20" x2="90" y2="90"/>
      <line x1="0" y1="20" x2="90" y2="-90"/>
      <line x1="0" y1="20" x2="90" y2="-30"/>
      <line x1="0" y1="20" x2="90" y2="30"/>
      <line x1="0" y1="20" x2="90" y2="90"/>
      <line x1="0" y1="60" x2="90" y2="-90"/>
      <line x1="0" y1="60" x2="90" y2="-30"/>
      <line x1="0" y1="60" x2="90" y2="30"/>
      <line x1="0" y1="60" x2="90" y2="90"/>

      <!-- hidden3 → output -->
      <line x1="90" y1="-90" x2="180" y2="-40"/>
      <line x1="90" y1="-90" x2="180" y2="40"/>
      <line x1="90" y1="-30" x2="180" y2="-40"/>
      <line x1="90" y1="-30" x2="180" y2="40"/>
      <line x1="90" y1="30" x2="180" y2="-40"/>
      <line x1="90" y1="30" x2="180" y2="40"/>
      <line x1="90" y1="90" x2="180" y2="-40"/>
      <line x1="90" y1="90" x2="180" y2="40"/>
    </g>

    <!-- Animated highlights (active signal) -->
    <g stroke="#22d3ee" stroke-width="1.4" fill="none" class="flow" filter="url(#b)">
      <line x1="-180" y1="-20" x2="-90" y2="-30"/>
      <line x1="-90" y1="-30" x2="0" y2="-20"/>
      <line x1="0" y1="-20" x2="90" y2="-30"/>
      <line x1="90" y1="-30" x2="180" y2="40"/>
    </g>

    <!-- Nodes -->
    <g filter="url(#b)">
      <!-- Input -->
      <circle cx="-180" cy="-60" r="6" fill="#22d3ee" class="pulse"/>
      <circle cx="-180" cy="-20" r="6" fill="#22d3ee" class="pulse"/>
      <circle cx="-180" cy="20"  r="6" fill="#22d3ee" class="pulse"/>
      <circle cx="-180" cy="60"  r="6" fill="#22d3ee" class="pulse"/>
      <!-- H1 -->
      <circle cx="-90" cy="-90" r="6" fill="#a78bfa"/>
      <circle cx="-90" cy="-30" r="6" fill="#a78bfa" class="pulse"/>
      <circle cx="-90" cy="30"  r="6" fill="#a78bfa"/>
      <circle cx="-90" cy="90"  r="6" fill="#a78bfa"/>
      <!-- H2 -->
      <circle cx="0" cy="-60" r="6" fill="#a78bfa"/>
      <circle cx="0" cy="-20" r="6" fill="#a78bfa" class="pulse"/>
      <circle cx="0" cy="20"  r="6" fill="#a78bfa"/>
      <circle cx="0" cy="60"  r="6" fill="#a78bfa"/>
      <!-- H3 -->
      <circle cx="90" cy="-90" r="6" fill="#a78bfa"/>
      <circle cx="90" cy="-30" r="6" fill="#a78bfa" class="pulse"/>
      <circle cx="90" cy="30"  r="6" fill="#a78bfa"/>
      <circle cx="90" cy="90"  r="6" fill="#a78bfa"/>
      <!-- Output -->
      <circle cx="180" cy="-40" r="8" fill="#ec4899" class="pulse"/>
      <circle cx="180" cy="40"  r="8" fill="#ec4899" class="pulse"/>
    </g>
  </g>

  <!-- Layer labels -->
  <g class="mono" font-size="9" fill="#64748b" text-anchor="middle">
    <text x="120" y="380">INPUT</text>
    <text x="210" y="380">H1</text>
    <text x="300" y="380">H2</text>
    <text x="390" y="380">H3</text>
    <text x="480" y="380">OUTPUT</text>
  </g>
</svg>