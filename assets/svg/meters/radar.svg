<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Innovation Radar">
  <title>Innovation Radar</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .rot { animation: r 16s linear infinite; transform-origin: 300px 300px; }
      @keyframes r { to { transform: rotate(360deg); } }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .blip { animation: blip 2.6s ease-in-out infinite; }
      @keyframes blip {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50%      { transform: scale(1.4); opacity: 1; }
      }
    </style>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="560" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ INNOVATION RADAR</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b" letter-spacing="2">SCAN · 360° · LIVE</text>

  <!-- Concentric rings -->
  <g transform="translate(300,330)" fill="none" stroke="#1e1b4b" stroke-width="0.8">
    <circle r="40"/>
    <circle r="90"/>
    <circle r="140"/>
    <circle r="190"/>
    <circle r="240"/>
    <!-- axes -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke-dasharray="1 4" stroke="#312e81"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke-dasharray="1 4" stroke="#312e81"/>
    <line x1="-170" y1="-170" x2="170" y2="170" stroke-dasharray="1 4" stroke="#312e81"/>
    <line x1="170" y1="-170" x2="-170" y2="170" stroke-dasharray="1 4" stroke="#312e81"/>
  </g>

  <!-- Sweep line -->
  <g transform="translate(300,330)" class="rot">
    <path d="M0 0 L240 0 A240 240 0 0 0 226 -84 Z" fill="url(#ring)" fill-opacity="0.15"/>
    <line x1="0" y1="0" x2="240" y2="0" stroke="url(#ring)" stroke-width="1.4" filter="url(#b)"/>
  </g>

  <!-- Axis labels -->
  <g transform="translate(300,330)" class="mono" font-size="9" fill="#64748b" letter-spacing="2">
    <text text-anchor="middle" y="-250">N · RAG</text>
    <text text-anchor="middle" y="262">S · OPS</text>
    <text x="-256" y="3" text-anchor="end">W · VISION</text>
    <text x="256" y="3">E · AGENTS</text>
    <text x="170" y="-180" transform="rotate(45 170 -180)">NE · MCP</text>
    <text x="-180" y="-180" transform="rotate(-45 -180 -180)">NW · A2A</text>
    <text x="170" y="190" transform="rotate(-45 170 190)">SE · DEPLOY</text>
    <text x="-180" y="190" transform="rotate(45 -180 190)">SW · DATA</text>
  </g>

  <!-- Blips -->
  <g transform="translate(300,330)" filter="url(#b)">
    <!-- N · RAG -->
    <g transform="translate(60,-180)">
      <circle r="6" fill="#22d3ee" class="blip"/>
      <circle r="14" fill="none" stroke="#22d3ee" stroke-opacity="0.3" class="pulse"/>
    </g>
    <!-- E · AGENTS -->
    <g transform="translate(195,-30)">
      <circle r="7" fill="#a78bfa" class="blip"/>
      <circle r="16" fill="none" stroke="#a78bfa" stroke-opacity="0.3" class="pulse"/>
    </g>
    <!-- SE · DEPLOY -->
    <g transform="translate(120,140)">
      <circle r="5" fill="#ec4899" class="blip"/>
      <circle r="12" fill="none" stroke="#ec4899" stroke-opacity="0.3" class="pulse"/>
    </g>
    <!-- W · VISION -->
    <g transform="translate(-160,40)">
      <circle r="5" fill="#10b981" class="blip"/>
      <circle r="12" fill="none" stroke="#10b981" stroke-opacity="0.3" class="pulse"/>
    </g>
    <!-- NE · MCP -->
    <g transform="translate(150,-150)">
      <circle r="4" fill="#f59e0b" class="blip"/>
      <circle r="10" fill="none" stroke="#f59e0b" stroke-opacity="0.3" class="pulse"/>
    </g>
    <!-- Center origin -->
    <circle r="3" fill="#22d3ee" class="pulse"/>
  </g>

  <!-- Stats strip -->
  <g transform="translate(36,560)">
    <text class="mono" font-size="9" fill="#64748b" letter-spacing="2">CONTACTS  ·  12  ·  RESOLVED  ·  9  ·  PENDING  ·  3</text>
    <text x="528" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">SIGNAL · STRONG</text>
  </g>
</svg>