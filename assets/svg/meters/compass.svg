<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Mission Compass">
  <title>Mission Compass</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .spin { animation: s 8s ease-in-out infinite; transform-origin: 300px 110px; }
      @keyframes s {
        0%   { transform: rotate(-12deg); }
        50%  { transform: rotate(8deg); }
        100% { transform: rotate(-12deg); }
      }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="600" height="220" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="180" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ MISSION COMPASS</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">HEADING · 042° · AGENTIC AI</text>

  <!-- Compass body -->
  <g transform="translate(110,110)">
    <circle r="78" fill="none" stroke="#1e1b4b" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.6"/>
    <circle r="60" fill="none" stroke="#1e1b4b" stroke-width="0.6"/>
    <!-- ticks -->
    <g stroke="#64748b" stroke-width="0.8">
      <line x1="0" y1="-78" x2="0" y2="-70"/>
      <line x1="78" y1="0"  x2="70" y2="0"/>
      <line x1="0" y1="78"  x2="0" y2="70"/>
      <line x1="-78" y1="0" x2="-70" y2="0"/>
      <line x1="55" y1="-55" x2="50" y2="-50"/>
      <line x1="55" y1="55"  x2="50" y2="50"/>
      <line x1="-55" y1="55" x2="-50" y2="50"/>
      <line x1="-55" y1="-55" x2="-50" y2="-50"/>
    </g>
    <g class="mono" font-size="8" fill="#64748b" letter-spacing="2">
      <text x="0"   y="-82" text-anchor="middle">N</text>
      <text x="82"  y="3" text-anchor="middle">E</text>
      <text x="0"   y="92" text-anchor="middle">S</text>
      <text x="-82" y="3" text-anchor="middle">W</text>
    </g>
    <!-- Needle -->
    <g class="spin">
      <path d="M0 -60 L8 0 L0 60 L-8 0 Z" fill="url(#needle)" filter="url(#b)"/>
      <path d="M0 -60 L8 0 L-8 0 Z" fill="#ec4899" opacity="0.9"/>
      <path d="M0 60 L8 0 L-8 0 Z" fill="#22d3ee" opacity="0.6"/>
    </g>
    <circle r="4" fill="#0a0a1a" stroke="#22d3ee" stroke-width="1" class="pulse"/>
  </g>

  <!-- Bearing / waypoints -->
  <g transform="translate(220,72)" class="mono" font-size="10" fill="#cbd5e1">
    <text fill="#64748b" letter-spacing="2">WAYPOINTS</text>
    <g transform="translate(0,18)">
      <text>▸ 2025 · SHIP ML @ REDROB</text>
      <text fill="#10b981">● done</text>
    </g>
    <g transform="translate(0,38)">
      <text>▸ 2026 · FLAGSHIP AGENTIC OSS</text>
      <text fill="#22d3ee" class="pulse">● live</text>
    </g>
    <g transform="translate(0,58)">
      <text>▸ 2026 · MULTI-AGENT PAPER</text>
      <text fill="#a78bfa">● drafting</text>
    </g>
    <g transform="translate(0,78)">
      <text>▸ 2027 · GRAD · TOP AI TEAM</text>
      <text fill="#f59e0b">○ next</text>
    </g>
    <g transform="translate(0,98)">
      <text>▸ ONGOING · BUILD IN PUBLIC</text>
      <text fill="#ec4899">○ future</text>
    </g>
  </g>
</svg>