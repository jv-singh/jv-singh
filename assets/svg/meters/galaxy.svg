<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Skill Galaxy">
  <title>Skill Galaxy</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .pulse { animation: p 3s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .spin { animation: s 40s linear infinite; transform-origin: 300px 240px; }
      .spin-r { animation: s 30s linear infinite reverse; transform-origin: 300px 240px; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="600" height="480" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="440" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ SKILL GALAXY</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">CONSTELLATIONS · 8</text>

  <!-- Core -->
  <g transform="translate(300,250)">
    <circle r="120" fill="url(#core)" class="pulse"/>
    <circle r="50" fill="none" stroke="url(#leg)" stroke-width="1.2" class="spin"/>
    <circle r="80" fill="none" stroke="#22d3ee" stroke-width="0.6" stroke-dasharray="2 6" class="spin-r"/>
    <circle r="110" fill="none" stroke="#ec4899" stroke-width="0.4" stroke-dasharray="1 8" class="spin"/>
    <circle r="30" fill="#0a0a1a" stroke="url(#leg)" stroke-width="1.4" filter="url(#b)"/>
    <text text-anchor="middle" y="2" class="mono" font-size="9" fill="#22d3ee" letter-spacing="3">AGENTIC</text>
    <text text-anchor="middle" y="14" class="mono" font-size="9" fill="#22d3ee" letter-spacing="3">CORE</text>
  </g>

  <!-- Stars / skill nodes -->
  <g class="mono" font-size="9" fill="#cbd5e1">
    <!-- Each cluster has a center node and label -->
    <g transform="translate(120,100)">
      <circle r="14" fill="#22d3ee" filter="url(#b)"/>
      <circle r="20" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text text-anchor="middle" y="32" letter-spacing="2">RAG · LANG</text>
    </g>
    <g transform="translate(490,90)">
      <circle r="14" fill="#a78bfa" filter="url(#b)"/>
      <circle r="20" fill="none" stroke="#a78bfa" stroke-opacity="0.3"/>
      <text text-anchor="middle" y="32" letter-spacing="2">AGENTS · GRAPH</text>
    </g>
    <g transform="translate(80,250)">
      <circle r="14" fill="#10b981" filter="url(#b)"/>
      <circle r="20" fill="none" stroke="#10b981" stroke-opacity="0.3"/>
      <text text-anchor="middle" y="32" letter-spacing="2">VISION · YOLO</text>
    </g>
    <g transform="translate(520,260)">
      <circle r="14" fill="#ec4899" filter="url(#b)"/>
      <circle r="20" fill="none" stroke="#ec4899" stroke-opacity="0.3"/>
      <text text-anchor="middle" y="32" letter-spacing="2">DEPLOY · API</text>
    </g>
    <g transform="translate(160,400)">
      <circle r="12" fill="#f59e0b" filter="url(#b)"/>
      <text text-anchor="middle" y="28" letter-spacing="2">DATA · SQL</text>
    </g>
    <g transform="translate(440,400)">
      <circle r="12" fill="#06b6d4" filter="url(#b)"/>
      <text text-anchor="middle" y="28" letter-spacing="2">CLOUD · DOCKER</text>
    </g>
    <g transform="translate(300,80)">
      <circle r="10" fill="#a3e635" filter="url(#b)"/>
      <text text-anchor="middle" y="26" letter-spacing="2">PROMPT · EVAL</text>
    </g>
    <g transform="translate(300,440)">
      <circle r="10" fill="#fb7185" filter="url(#b)"/>
      <text text-anchor="middle" y="-12" letter-spacing="2">RESEARCH</text>
    </g>
  </g>

  <!-- Connectors to core -->
  <g stroke="#a78bfa" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.4" fill="none">
    <line x1="120" y1="100" x2="300" y2="250"/>
    <line x1="490" y1="90"  x2="300" y2="250"/>
    <line x1="80"  y1="250" x2="300" y2="250"/>
    <line x1="520" y1="260" x2="300" y2="250"/>
    <line x1="160" y1="400" x2="300" y2="250"/>
    <line x1="440" y1="400" x2="300" y2="250"/>
    <line x1="300" y1="80"  x2="300" y2="250"/>
    <line x1="300" y1="440" x2="300" y2="250"/>
  </g>

  <text x="36" y="448" class="mono" font-size="9" fill="#64748b" letter-spacing="2">8 DOMAINS  ·  24 SUBDOMAINS  ·  ORBITING CORE</text>
  <text x="564" y="448" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">CONSTELLATION · STABLE</text>
</svg>