<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="System Monitor — CPU / GPU / MEM / NET">
  <title>System Monitor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="cre" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .spark { animation: spark 3s linear infinite; }
      @keyframes spark { to { transform: translateX(-220px); } }
    </style>
  </defs>
  <rect width="600" height="280" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="240" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ SYSTEM MONITOR</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">SAMPLE 60Hz · STABLE</text>

  <!-- 6 horizontal bars -->
  <g transform="translate(36,72)" class="mono" font-size="10">
    <g>
      <text fill="#22d3ee">CPU</text>
      <text x="60" fill="#94a3b8">neural cores · 12 threads</text>
      <text x="528" text-anchor="end" fill="#22d3ee">71%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="375" height="6" rx="3" fill="url(#cpu)"/>
    </g>
    <g transform="translate(0,28)">
      <text fill="#a78bfa">MEM</text>
      <text x="60" fill="#94a3b8">curiosity · grit · knowledge</text>
      <text x="528" text-anchor="end" fill="#a78bfa">92%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="486" height="6" rx="3" fill="url(#mem)"/>
    </g>
    <g transform="translate(0,56)">
      <text fill="#ec4899">GPU</text>
      <text x="60" fill="#94a3b8">imagination renderer</text>
      <text x="528" text-anchor="end" fill="#ec4899">84%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="443" height="6" rx="3" fill="url(#gpu)"/>
    </g>
    <g transform="translate(0,84)">
      <text fill="#10b981">NET</text>
      <text x="60" fill="#94a3b8">agent mesh · global</text>
      <text x="528" text-anchor="end" fill="#10b981">78%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="411" height="6" rx="3" fill="url(#net)"/>
    </g>
    <g transform="translate(0,112)">
      <text fill="#f59e0b">CRE</text>
      <text x="60" fill="#94a3b8">creativity index</text>
      <text x="528" text-anchor="end" fill="#f59e0b">96%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="507" height="6" rx="3" fill="url(#cre)"/>
    </g>
    <g transform="translate(0,140)">
      <text fill="#fbbf24">CF </text>
      <text x="60" fill="#94a3b8">coffee reserve</text>
      <text x="528" text-anchor="end" fill="#fbbf24">42%</text>
      <rect y="6" width="528" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="222" height="6" rx="3" fill="url(#cf)"/>
    </g>
  </g>

  <!-- Sparkline strip -->
  <g transform="translate(36,240)" class="mono" font-size="8" fill="#64748b">
    <text>▸ 24H · ENERGY</text>
  </g>
  <g transform="translate(80,232)">
    <g clip-path="inset(0)">
      <g class="spark">
        <polyline fill="none" stroke="url(#cpu)" stroke-width="1.4" points="0,12 8,10 16,14 24,8 32,12 40,6 48,10 56,4 64,8 72,12 80,6 88,2 96,8 104,4 112,6 120,10 128,4 136,8 144,2 152,6 160,10 168,4 176,8 184,6 192,10 200,4 208,8 216,6 224,10 232,4 240,8"/>
      </g>
    </g>
  </g>
  <text x="564" y="248" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">NOMINAL</text>
</svg>