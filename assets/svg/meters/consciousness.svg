<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="AI Consciousness Meter">
  <title>AI Consciousness Meter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .pulse { animation: p 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .fill-w { animation: fillw 3s ease-out forwards; }
      @keyframes fillw { from { width: 0; } to { width: 480px; } }
      .wave { animation: wave 3s linear infinite; transform-origin: center; }
      @keyframes wave { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="600" height="280" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="240" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ AI CONSCIOUSNESS METER</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b" letter-spacing="2">SCAN 96.4% · STABLE</text>

  <!-- Core ring -->
  <g transform="translate(120,150)">
    <circle r="65" fill="url(#glow)" class="pulse"/>
    <circle r="48" fill="none" stroke="url(#bar-grad)" stroke-width="2" filter="url(#bloom)"/>
    <circle r="40" fill="none" stroke="#22d3ee" stroke-width="0.6" stroke-dasharray="2 4" class="wave"/>
    <text text-anchor="middle" class="mono" font-size="9" fill="#22d3ee" y="-4" letter-spacing="2">CORE</text>
    <text text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#e2e8f0" y="16" filter="url(#bloom)">96</text>
    <text text-anchor="middle" class="mono" font-size="8" fill="#64748b" y="30">/ 100</text>
  </g>

  <!-- Right side metric bars -->
  <g transform="translate(220,90)">
    <text class="mono" font-size="9" fill="#64748b" letter-spacing="2">SUBSYSTEMS</text>

    <g transform="translate(0,18)">
      <!-- Reasoning -->
      <text class="mono" font-size="10" fill="#cbd5e1">reasoning</text>
      <text x="320" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">98</text>
      <rect y="6" width="320" height="6" rx="3" fill="#0d0d1a"/>
      <rect y="6" width="313" height="6" rx="3" fill="url(#bar-grad)"/>

      <!-- Memory -->
      <g transform="translate(0,28)">
        <text class="mono" font-size="10" fill="#cbd5e1">memory</text>
        <text x="320" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">94</text>
        <rect y="6" width="320" height="6" rx="3" fill="#0d0d1a"/>
        <rect y="6" width="300" height="6" rx="3" fill="url(#bar-grad)"/>
      </g>

      <!-- Creativity -->
      <g transform="translate(0,56)">
        <text class="mono" font-size="10" fill="#cbd5e1">creativity</text>
        <text x="320" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">92</text>
        <rect y="6" width="320" height="6" rx="3" fill="#0d0d1a"/>
        <rect y="6" width="294" height="6" rx="3" fill="url(#bar-grad)"/>
      </g>

      <!-- Empathy -->
      <g transform="translate(0,84)">
        <text class="mono" font-size="10" fill="#cbd5e1">empathy</text>
        <text x="320" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">89</text>
        <rect y="6" width="320" height="6" rx="3" fill="#0d0d1a"/>
        <rect y="6" width="285" height="6" rx="3" fill="url(#bar-grad)"/>
      </g>

      <!-- Focus -->
      <g transform="translate(0,112)">
        <text class="mono" font-size="10" fill="#cbd5e1">focus</text>
        <text x="320" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">95</text>
        <rect y="6" width="320" height="6" rx="3" fill="#0d0d1a"/>
        <rect y="6" width="304" height="6" rx="3" fill="url(#bar-grad)"/>
      </g>
    </g>
  </g>

  <!-- Footer ticker -->
  <g transform="translate(36,238)">
    <circle r="3" cx="0" cy="0" fill="#10b981" class="pulse"/>
    <text x="12" class="mono" font-size="9" fill="#94a3b8" letter-spacing="2">LIVE  ·  sampling 60Hz  ·  feed: brain://jaivardhan</text>
    <text x="528" text-anchor="end" class="mono" font-size="9" fill="#64748b">▣ ▣ ▣ ▣ ▣</text>
  </g>
</svg>