<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Neural Density Graph">
  <title>Neural Density Graph</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .draw { stroke-dasharray: 1200; animation: d 4s ease-out forwards; }
      @keyframes d { to { stroke-dashoffset: 0; } }
      .pulse { animation: p 2s ease-in-out infinite; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="600" height="320" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="560" height="280" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>

  <text x="36" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ NEURAL DENSITY · 12 MONTHS</text>
  <text x="564" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">PEAK 94 · TREND ↑ 67%</text>

  <!-- Grid -->
  <g transform="translate(36,80)" stroke="#1e1b4b" stroke-width="0.5">
    <line x1="0" y1="0"   x2="528" y2="0"/>
    <line x1="0" y1="40"  x2="528" y2="40"/>
    <line x1="0" y1="80"  x2="528" y2="80"/>
    <line x1="0" y1="120" x2="528" y2="120"/>
    <line x1="0" y1="160" x2="528" y2="160"/>
    <line x1="0"   y1="0" x2="0"   y2="160"/>
    <line x1="132" y1="0" x2="132" y2="160" stroke-dasharray="1 4"/>
    <line x1="264" y1="0" x2="264" y2="160" stroke-dasharray="1 4"/>
    <line x1="396" y1="0" x2="396" y2="160" stroke-dasharray="1 4"/>
    <line x1="528" y1="0" x2="528" y2="160" stroke-dasharray="1 4"/>
  </g>

  <!-- Y labels -->
  <g transform="translate(36,80)" class="mono" font-size="8" fill="#64748b">
    <text x="-6" y="3" text-anchor="end">100</text>
    <text x="-6" y="43" text-anchor="end">75</text>
    <text x="-6" y="83" text-anchor="end">50</text>
    <text x="-6" y="123" text-anchor="end">25</text>
    <text x="-6" y="163" text-anchor="end">0</text>
  </g>

  <!-- Area + Line -->
  <g transform="translate(36,80)">
    <path d="M0 140 L40 120 L88 130 L132 100 L176 110 L220 80 L264 90 L308 50 L352 70 L396 30 L440 60 L484 40 L528 20 L528 160 L0 160 Z" fill="url(#area)"/>
    <path d="M0 140 L40 120 L88 130 L132 100 L176 110 L220 80 L264 90 L308 50 L352 70 L396 30 L440 60 L484 40 L528 20" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#b)" class="draw"/>
    <!-- Peak point -->
    <g transform="translate(396,30)">
      <circle r="6" fill="#ec4899" filter="url(#b)" class="pulse"/>
      <circle r="3" fill="#fff"/>
      <text y="-12" text-anchor="middle" class="mono" font-size="9" fill="#ec4899">PEAK</text>
    </g>
  </g>

  <!-- X labels -->
  <g transform="translate(36,260)" class="mono" font-size="8" fill="#64748b">
    <text x="0">JUL</text>
    <text x="132">SEP</text>
    <text x="264">NOV</text>
    <text x="396">JAN</text>
    <text x="528" text-anchor="end">JUN</text>
  </g>

  <text x="36" y="288" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▣ KNOWLEDGE  ▣ AGENTS  ▣ VISION  ▣ DEPLOY</text>
  <text x="564" y="288" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">12M · GROWING</text>
</svg>