<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Redrob — Production ML Poster">
  <title>Redrob · McKinley Rice — Production ML Poster</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#020410"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7f1d1d" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 1.6s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .live { animation: l 1.4s ease-in-out infinite; }
      @keyframes l { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="600" cy="320" rx="540" ry="280" fill="url(#spot)"/>

  <g transform="translate(60,60)">
    <rect width="280" height="32" rx="4" fill="#06070d" stroke="#ef4444"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#ef4444" letter-spacing="3">▸ PROJECT_05 · LIVE · CURRENT</text>
  </g>
  <g transform="translate(1140,60)" text-anchor="end">
    <text class="mono" font-size="11" fill="#10b981" letter-spacing="2" class="live">● LIVE</text>
    <text y="20" class="mono" font-size="9" fill="#64748b">2025 → present · McKinley Rice</text>
  </g>

  <g transform="translate(60,180)">
    <text class="sans" font-size="14" letter-spacing="8" fill="#ef4444">// PRODUCTION MACHINE LEARNING</text>
    <text y="100" class="sans" font-size="140" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-4">REDROB</text>
    <text y="180" class="sans" font-size="20" font-weight="300" fill="#cbd5e1" letter-spacing="14">× MCKINLEY RICE</text>
  </g>

  <!-- Deploy console -->
  <g transform="translate(720,180)">
    <rect width="420" height="380" rx="6" fill="#06070d" stroke="#7f1d1d"/>
    <text x="20" y="30" class="mono" font-size="10" fill="#ef4444" letter-spacing="3">▌ DEPLOY CONTROL</text>

    <!-- Pipeline -->
    <g transform="translate(40,60)">
      <text class="mono" font-size="9" fill="#64748b">PIPELINE</text>
      <g class="mono" font-size="10">
        <g transform="translate(0,20)">
          <rect width="340" height="24" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
          <text x="10" y="16" fill="#22d3ee">▸ data-ingest</text>
          <text x="160" y="16" fill="#10b981">● ok</text>
          <text x="260" y="16" fill="#64748b">12.3K/min</text>
        </g>
        <g transform="translate(0,50)">
          <rect width="340" height="24" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
          <text x="10" y="16" fill="#22d3ee">▸ embed-batch</text>
          <text x="160" y="16" fill="#10b981">● ok</text>
          <text x="260" y="16" fill="#64748b">8.7K/min</text>
        </g>
        <g transform="translate(0,80)">
          <rect width="340" height="24" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
          <text x="10" y="16" fill="#22d3ee">▸ rag-build</text>
          <text x="160" y="16" fill="#f59e0b">● running</text>
          <text x="260" y="16" fill="#64748b">62%</text>
        </g>
        <g transform="translate(0,110)">
          <rect width="340" height="24" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
          <text x="10" y="16" fill="#22d3ee">▸ eval</text>
          <text x="160" y="16" fill="#64748b">○ queue</text>
          <text x="260" y="16" fill="#64748b">--</text>
        </g>
        <g transform="translate(0,140)">
          <rect width="340" height="24" rx="4" fill="#0d0d1a" stroke="#1e1b4b"/>
          <text x="10" y="16" fill="#22d3ee">▸ deploy</text>
          <text x="160" y="16" fill="#64748b">○ pending</text>
          <text x="260" y="16" fill="#64748b">--</text>
        </g>
      </g>
    </g>

    <!-- Live metrics -->
    <g transform="translate(40,260)">
      <text class="mono" font-size="9" fill="#64748b">LIVE METRICS · LAST HOUR</text>
      <g transform="translate(0,16)">
        <rect width="340" height="80" rx="4" fill="#0d0d1a"/>
        <g transform="translate(12,12)">
          <polyline points="0,40 20,32 40,38 60,28 80,32 100,22 120,30 140,16 160,28 180,18 200,30 220,12 240,22 260,10 280,20 300,8 320,18" fill="none" stroke="#ef4444" stroke-width="1.6" filter="url(#bloom)"/>
          <polyline points="0,46 20,42 40,44 60,38 80,40 100,34 120,38 140,32 160,38 180,30 200,36 220,28 240,32 260,24 280,30 300,20 320,26" fill="none" stroke="#ec4899" stroke-width="1.4"/>
        </g>
        <text x="12" y="74" class="mono" font-size="8" fill="#64748b">requests · errors</text>
      </g>
    </g>

    <text x="20" y="364" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ FastAPI  ·  Postgres  ·  LLM  ·  eval harness</text>
  </g>

  <!-- Stats -->
  <g transform="translate(60,540)">
    <rect width="640" height="100" rx="6" fill="#06070d" stroke="#7f1d1d"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#ef4444" letter-spacing="2">CURRENT ROLE · ML ENGINEER INTERN</text>
    <text x="20" y="60" class="sans" font-size="13" fill="#cbd5e1">Production ML pipelines, LLM features,</text>
    <text x="20" y="80" class="sans" font-size="13" fill="#cbd5e1">real-world shipping at McKinley Rice.</text>
  </g>
  <g transform="translate(740,540)">
    <rect width="400" height="100" rx="6" fill="#06070d" stroke="#7f1d1d"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#ec4899" letter-spacing="2">WHAT I'M LEARNING</text>
    <text x="20" y="60" class="sans" font-size="13" fill="#cbd5e1">Reliability, observability,</text>
    <text x="20" y="80" class="sans" font-size="13" fill="#cbd5e1">and how to ship that matters.</text>
  </g>

  <g transform="translate(60,660)">
    <text class="mono" font-size="10" fill="#22d3ee">▌ STACK</text>
    <text x="80" class="mono" font-size="10" fill="#94a3b8">Python · FastAPI · Postgres · LangChain · LLMs · Docker · AWS</text>
  </g>
</svg>