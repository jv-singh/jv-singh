<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Behelit AI — Agentic Loan Advisory Poster">
  <title>Behelit AI — Project Poster</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#0f0820"/>
      <stop offset="100%" stop-color="#020410"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1b4b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .flow { stroke-dasharray: 4 6; animation: f 3s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <!-- BG -->
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="600" cy="320" rx="540" ry="280" fill="url(#spot)"/>

  <!-- Top tag -->
  <g transform="translate(60,60)">
    <rect width="280" height="32" rx="4" fill="#06070d" stroke="#a78bfa"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#a78bfa" letter-spacing="3">▸ PROJECT_01 · FLAGSHIP</text>
  </g>

  <g transform="translate(1140,60)" text-anchor="end">
    <text class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">STATUS · SHIPPED</text>
    <text y="20" class="mono" font-size="9" fill="#64748b">v1.4 · 8 AGENTS · LIVE</text>
  </g>

  <!-- Title -->
  <g transform="translate(60,180)">
    <text class="sans" font-size="14" letter-spacing="8" fill="#22d3ee">// AGENTIC LOAN ADVISORY</text>
    <text y="100" class="sans" font-size="120" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-3">BEHELIT</text>
    <text y="100" class="sans" font-size="120" font-weight="900" fill="none" stroke="#a78bfa" stroke-width="0.5" letter-spacing="-3" opacity="0.4">BEHELIT</text>
    <text y="160" class="sans" font-size="56" font-weight="200" fill="#cbd5e1" letter-spacing="20">A · I</text>
  </g>

  <!-- Architecture diagram (right side) -->
  <g transform="translate(720,260)">
    <rect x="0" y="0" width="420" height="280" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#22d3ee" letter-spacing="3">▌ ARCHITECTURE · 8 AGENT MESH</text>

    <!-- Center orchestrator -->
    <g transform="translate(210,150)">
      <circle r="36" fill="none" stroke="url(#title)" stroke-width="1.4" filter="url(#bloom)"/>
      <text text-anchor="middle" y="-2" class="mono" font-size="9" fill="#22d3ee">ORCHESTRATOR</text>
      <text text-anchor="middle" y="10" class="mono" font-size="8" fill="#a78bfa">LangGraph</text>
      <circle r="6" fill="#a78bfa" class="pulse"/>
    </g>

    <!-- 8 agents around -->
    <g fill="none" stroke="url(#conn)" stroke-width="1" class="flow">
      <line x1="210" y1="150" x2="60"  y2="80"/>
      <line x1="210" y1="150" x2="360" y2="80"/>
      <line x1="210" y1="150" x2="60"  y2="150"/>
      <line x1="210" y1="150" x2="360" y2="150"/>
      <line x1="210" y1="150" x2="60"  y2="220"/>
      <line x1="210" y1="150" x2="360" y2="220"/>
      <line x1="210" y1="150" x2="210" y2="60"/>
      <line x1="210" y1="150" x2="210" y2="240"/>
    </g>

    <g class="mono" font-size="8" fill="#cbd5e1" text-anchor="middle">
      <g transform="translate(60,80)"><circle r="8" fill="#22d3ee" filter="url(#bloom)"/><text y="22">credit</text></g>
      <g transform="translate(360,80)"><circle r="8" fill="#22d3ee" filter="url(#bloom)"/><text y="22">risk</text></g>
      <g transform="translate(60,150)"><circle r="8" fill="#a78bfa" filter="url(#bloom)"/><text y="22">product</text></g>
      <g transform="translate(360,150)"><circle r="8" fill="#a78bfa" filter="url(#bloom)"/><text y="22">policy</text></g>
      <g transform="translate(60,220)"><circle r="8" fill="#ec4899" filter="url(#bloom)"/><text y="22">kyc</text></g>
      <g transform="translate(360,220)"><circle r="8" fill="#ec4899" filter="url(#bloom)"/><text y="22">fraud</text></g>
      <g transform="translate(210,60)"><circle r="8" fill="#10b981" filter="url(#bloom)"/><text y="-12">rag</text></g>
      <g transform="translate(210,240)"><circle r="8" fill="#f59e0b" filter="url(#bloom)"/><text y="22">explain</text></g>
    </g>

    <text x="20" y="264" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ LangGraph  ·  RAG  ·  Vector DB  ·  Flask  ·  LLMs</text>
  </g>

  <!-- Stats row -->
  <g transform="translate(60,540)">
    <rect width="280" height="100" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#64748b" letter-spacing="2">PROBLEM</text>
    <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#cbd5e1">Loan advisory is</text>
    <text x="20" y="78" class="sans" font-size="14" font-weight="600" fill="#cbd5e1">slow &amp; opaque.</text>
  </g>

  <g transform="translate(360,540)">
    <rect width="280" height="100" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#22d3ee" letter-spacing="2">SOLUTION</text>
    <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#cbd5e1">8 agents reason</text>
    <text x="20" y="78" class="sans" font-size="14" font-weight="600" fill="#cbd5e1">over data live.</text>
  </g>

  <g transform="translate(660,540)">
    <rect width="240" height="100" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#a78bfa" letter-spacing="2">IMPACT</text>
    <text x="20" y="60" class="mono" font-size="20" font-weight="700" fill="#a78bfa">8×</text>
    <text x="60" y="60" class="mono" font-size="10" fill="#94a3b8">faster</text>
    <text x="20" y="80" class="mono" font-size="10" fill="#64748b">advisory cycle</text>
  </g>

  <g transform="translate(920,540)">
    <rect width="220" height="100" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#ec4899" letter-spacing="2">FUTURE</text>
    <text x="20" y="60" class="sans" font-size="13" fill="#cbd5e1">v2 · streaming,</text>
    <text x="20" y="78" class="sans" font-size="13" fill="#cbd5e1">multilingual.</text>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(60,660)">
    <text class="mono" font-size="10" fill="#22d3ee">▌ STACK</text>
    <text x="80" class="mono" font-size="10" fill="#94a3b8">Python · LangGraph · RAG · Flask · Pinecone · OpenAI · FastAPI</text>
  </g>
</svg>