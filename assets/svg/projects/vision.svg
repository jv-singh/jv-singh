<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Vision Bot — Computer Vision Poster">
  <title>Vision Bot — Project Poster</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1207"/>
      <stop offset="100%" stop-color="#020410"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3f1d0c" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .scan { animation: s 3s linear infinite; }
      @keyframes s { to { transform: translateY(220px); } }
      .blip { animation: blip 1.4s ease-in-out infinite; }
      @keyframes blip { 0%,100% { opacity: 0.4 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="600" cy="320" rx="540" ry="280" fill="url(#spot)"/>

  <g transform="translate(60,60)">
    <rect width="280" height="32" rx="4" fill="#06070d" stroke="#f59e0b"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#f59e0b" letter-spacing="3">▸ PROJECT_03 · COMPUTER VISION</text>
  </g>
  <g transform="translate(1140,60)" text-anchor="end">
    <text class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">STATUS · INDUSTRIAL TRIAL</text>
    <text y="20" class="mono" font-size="9" fill="#64748b">v1.2 · YOLOv8 · edge</text>
  </g>

  <g transform="translate(60,180)">
    <text class="sans" font-size="14" letter-spacing="8" fill="#f59e0b">// INDUSTRIAL COMPUTER VISION</text>
    <text y="100" class="sans" font-size="120" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-3">VISION</text>
    <text y="200" class="sans" font-size="100" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-2">BOT</text>
  </g>

  <!-- Detection panel -->
  <g transform="translate(720,200)">
    <rect width="420" height="320" rx="6" fill="#06070d" stroke="#3f1d0c"/>
    <rect x="14" y="14" width="392" height="252" rx="4" fill="#020617" stroke="#1e1b4b"/>
    <text x="34" y="34" class="mono" font-size="9" fill="#f59e0b" letter-spacing="2">▌ LIVE DETECTION · BOTTLE-INDUSTRIAL</text>

    <!-- Mock scene -->
    <g transform="translate(40,50)">
      <!-- scan line -->
      <rect class="scan" width="350" height="3" fill="#22d3ee" opacity="0.5"/>
      <!-- floor line -->
      <line x1="0" y1="180" x2="350" y2="180" stroke="#1e1b4b" stroke-width="1"/>
      <!-- bottles -->
      <g stroke="#f59e0b" stroke-width="1.4" fill="none">
        <rect x="40"  y="100" width="40" height="80"/>
        <rect x="100" y="100" width="40" height="80"/>
        <rect x="160" y="100" width="40" height="80"/>
        <rect x="220" y="100" width="40" height="80"/>
        <rect x="280" y="100" width="40" height="80"/>
      </g>
      <!-- Detection boxes -->
      <g fill="none" stroke="#10b981" stroke-width="1.4">
        <rect x="38"  y="98"  width="44" height="84"/>
        <rect x="98"  y="98"  width="44" height="84"/>
        <rect x="158" y="98"  width="44" height="84"/>
        <rect x="218" y="98"  width="44" height="84"/>
        <rect x="278" y="98"  width="44" height="84"/>
      </g>
      <!-- labels -->
      <g class="mono" font-size="8" fill="#10b981">
        <rect x="38"  y="86" width="48" height="12" fill="#022c22"/>
        <text x="42" y="95">bottle 0.94</text>
        <rect x="98"  y="86" width="48" height="12" fill="#022c22"/>
        <text x="102" y="95">bottle 0.91</text>
        <rect x="158" y="86" width="48" height="12" fill="#022c22"/>
        <text x="162" y="95">bottle 0.96</text>
        <rect x="218" y="86" width="48" height="12" fill="#022c22"/>
        <text x="222" y="95">bottle 0.89</text>
        <rect x="278" y="86" width="48" height="12" fill="#022c22"/>
        <text x="282" y="95">bottle 0.97</text>
      </g>
      <circle cx="60" cy="60" r="3" fill="#22d3ee" class="blip"/>
      <circle cx="170" cy="40" r="3" fill="#ec4899" class="blip"/>
      <circle cx="280" cy="50" r="3" fill="#10b981" class="blip"/>
    </g>

    <g transform="translate(14,280)" class="mono" font-size="10">
      <text fill="#64748b">COUNT</text>
      <text x="60" font-size="14" fill="#22d3ee" font-weight="700">5</text>
      <text x="100" fill="#64748b">FPS</text>
      <text x="140" font-size="14" fill="#a78bfa" font-weight="700">38</text>
      <text x="180" fill="#64748b">mAP</text>
      <text x="220" font-size="14" fill="#10b981" font-weight="700">0.94</text>
      <text x="270" fill="#64748b">DEVICE</text>
      <text x="330" font-size="11" fill="#f59e0b">EDGE</text>
    </g>
  </g>

  <!-- Stats -->
  <g transform="translate(60,540)">
    <rect width="640" height="100" rx="6" fill="#06070d" stroke="#3f1d0c"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#f59e0b" letter-spacing="2">PIPELINE · REAL-TIME</text>
    <text x="20" y="56" class="sans" font-size="13" fill="#cbd5e1">Frame → YOLOv8 → ByteTrack → count → CSV.</text>
    <text x="20" y="80" class="mono" font-size="10" fill="#94a3b8">▶ camera feed  ·  ▶ pre-process  ·  ▶ detect  ·  ▶ track  ·  ▶ log</text>
  </g>
  <g transform="translate(740,540)">
    <rect width="400" height="100" rx="6" fill="#06070d" stroke="#3f1d0c"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#ec4899" letter-spacing="2">FUTURE · EDGE</text>
    <text x="20" y="60" class="sans" font-size="13" fill="#cbd5e1">Jetson deploy · anomaly</text>
    <text x="20" y="80" class="sans" font-size="13" fill="#cbd5e1">detection · live dashboard.</text>
  </g>

  <g transform="translate(60,660)">
    <text class="mono" font-size="10" fill="#22d3ee">▌ STACK</text>
    <text x="80" class="mono" font-size="10" fill="#94a3b8">PyTorch · YOLOv8 · OpenCV · ByteTrack · FastAPI · ONNX · Jetson</text>
  </g>
</svg>