<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Enterprise RAGBot — Poster">
  <title>Enterprise RAGBot — Project Poster</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f1a"/>
      <stop offset="100%" stop-color="#020410"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#064e3b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .flow { animation: f 2s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -300; } }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="600" cy="320" rx="540" ry="280" fill="url(#spot)"/>

  <g transform="translate(60,60)">
    <rect width="280" height="32" rx="4" fill="#06070d" stroke="#10b981"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#10b981" letter-spacing="3">▸ PROJECT_02 · ENTERPRISE</text>
  </g>
  <g transform="translate(1140,60)" text-anchor="end">
    <text class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">STATUS · IN PRODUCTION</text>
    <text y="20" class="mono" font-size="9" fill="#64748b">v2.1 · n8n · Pinecone</text>
  </g>

  <g transform="translate(60,180)">
    <text class="sans" font-size="14" letter-spacing="8" fill="#22d3ee">// RAG · WORKFLOW AUTOMATION</text>
    <text y="100" class="sans" font-size="100" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-2">AGENTIC</text>
    <text y="190" class="sans" font-size="100" font-weight="900" fill="url(#title)" filter="url(#bloom)" letter-spacing="-2">RAGBOT</text>
  </g>

  <!-- Flow diagram -->
  <g transform="translate(640,180)">
    <rect width="500" height="380" rx="6" fill="#06070d" stroke="#064e3b"/>
    <text x="20" y="30" class="mono" font-size="10" fill="#10b981" letter-spacing="3">▌ RAG PIPELINE</text>

    <!-- Steps -->
    <g class="mono" font-size="10" fill="#cbd5e1">
      <g transform="translate(40,70)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#10b981"/>
        <text x="60" y="22" text-anchor="middle" fill="#10b981">INGEST</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">PDF · DOCX · URL</text>
      </g>
      <g transform="translate(190,70)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#22d3ee"/>
        <text x="60" y="22" text-anchor="middle" fill="#22d3ee">EMBED</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">bge-large · 1024d</text>
      </g>
      <g transform="translate(340,70)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#a78bfa"/>
        <text x="60" y="22" text-anchor="middle" fill="#a78bfa">VECTOR DB</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">Pinecone</text>
      </g>

      <g transform="translate(40,150)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#ec4899"/>
        <text x="60" y="22" text-anchor="middle" fill="#ec4899">QUERY</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">natural language</text>
      </g>
      <g transform="translate(190,150)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#f59e0b"/>
        <text x="60" y="22" text-anchor="middle" fill="#f59e0b">RETRIEVE</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">top-k · rerank</text>
      </g>
      <g transform="translate(340,150)">
        <rect width="120" height="48" rx="6" fill="#022c22" stroke="#10b981"/>
        <text x="60" y="22" text-anchor="middle" fill="#10b981">GENERATE</text>
        <text x="60" y="38" text-anchor="middle" font-size="8" fill="#64748b">Groq · Llama 3</text>
      </g>

      <!-- Output -->
      <g transform="translate(190,250)">
        <rect width="220" height="56" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.4"/>
        <text x="110" y="22" text-anchor="middle" font-size="11" fill="#10b981" letter-spacing="2">GROUNDED ANSWER</text>
        <text x="110" y="40" text-anchor="middle" font-size="9" fill="#64748b">with citations &amp; confidence</text>
      </g>
    </g>

    <!-- Animated flow lines -->
    <g stroke="#10b981" stroke-width="1.4" fill="none" stroke-dasharray="6 8" class="flow">
      <line x1="160" y1="94"  x2="190" y2="94"/>
      <line x1="310" y1="94"  x2="340" y2="94"/>
      <line x1="400" y1="118" x2="400" y2="150"/>
      <line x1="160" y1="174" x2="190" y2="174"/>
      <line x1="310" y1="174" x2="340" y2="174"/>
      <line x1="400" y1="198" x2="300" y2="250"/>
      <line x1="340" y1="174" x2="300" y2="250"/>
    </g>

    <text x="20" y="364" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ n8n  ·  Groq  ·  Pinecone  ·  bge-large  ·  reranker</text>
  </g>

  <!-- Stats -->
  <g transform="translate(60,540)">
    <rect width="540" height="100" rx="6" fill="#06070d" stroke="#064e3b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#10b981" letter-spacing="2">RESULTS · PRODUCTION METRICS</text>
    <g transform="translate(20,46)" class="mono">
      <text fill="#64748b">queries/day</text>
      <text x="0" y="32" font-size="20" font-weight="700" fill="#22d3ee">12.4K</text>
      <text x="120" fill="#64748b">avg latency</text>
      <text x="120" y="32" font-size="20" font-weight="700" fill="#a78bfa">420ms</text>
      <text x="280" fill="#64748b">precision@5</text>
      <text x="280" y="32" font-size="20" font-weight="700" fill="#10b981">0.94</text>
      <text x="440" fill="#64748b">uptime</text>
      <text x="440" y="32" font-size="20" font-weight="700" fill="#10b981">99.9%</text>
    </g>
  </g>
  <g transform="translate(640,540)">
    <rect width="500" height="100" rx="6" fill="#06070d" stroke="#064e3b"/>
    <text x="20" y="30" class="mono" font-size="9" fill="#22d3ee" letter-spacing="2">FUTURE · v2.1</text>
    <text x="20" y="60" class="sans" font-size="13" fill="#cbd5e1">Multi-tenant routing · streaming ·</text>
    <text x="20" y="80" class="sans" font-size="13" fill="#cbd5e1">live eval harness · A/B testing.</text>
  </g>

  <g transform="translate(60,660)">
    <text class="mono" font-size="10" fill="#22d3ee">▌ STACK</text>
    <text x="80" class="mono" font-size="10" fill="#94a3b8">n8n · Groq · Pinecone · bge-large · cross-encoder · Llama 3</text>
  </g>
</svg>