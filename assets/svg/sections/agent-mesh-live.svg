<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="AI Agent Mesh — Live">
  <title>JAIVARDHAN OS · Agent Mesh — Live</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#020617"/></radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .flow { stroke-dasharray: 3 5; animation: f 3s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -300; } }
      .orb { animation: orb 6s ease-in-out infinite; transform-origin: center; }
      @keyframes orb { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="320" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ AGENT MESH · LIVE COORDINATION</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">6 AGENTS · ALL GREEN</text>

  <g transform="translate(600,180)">
    <!-- Concentric guide rings -->
    <circle r="140" fill="none" stroke="#1e1b4b" stroke-width="0.6"/>
    <circle r="100" fill="none" stroke="#312e81" stroke-width="0.6" stroke-dasharray="2 6"/>

    <!-- 6 agent nodes around -->
    <g class="orb">
      <!-- Researcher (top) -->
      <g transform="translate(0,-140)">
        <circle r="22" fill="#0a0a1a" stroke="#22d3ee" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#22d3ee" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#22d3ee" font-weight="700">RE</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">researcher</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">arxiv · papers</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>

      <!-- Architect (top-right) -->
      <g transform="translate(121,-70)">
        <circle r="22" fill="#0a0a1a" stroke="#a78bfa" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#a78bfa" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#a78bfa" font-weight="700">AR</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">architect</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">system design</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>

      <!-- Builder (bottom-right) -->
      <g transform="translate(121,70)">
        <circle r="22" fill="#0a0a1a" stroke="#ec4899" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#ec4899" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#ec4899" font-weight="700">BU</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">builder</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">ships code</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>

      <!-- Critic (bottom) -->
      <g transform="translate(0,140)">
        <circle r="22" fill="#0a0a1a" stroke="#f59e0b" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#f59e0b" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#f59e0b" font-weight="700">CR</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">critic</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">reviews · eval</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>

      <!-- Deployer (bottom-left) -->
      <g transform="translate(-121,70)">
        <circle r="22" fill="#0a0a1a" stroke="#10b981" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#10b981" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#10b981" font-weight="700">DE</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">deployer</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">prod · CI</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>

      <!-- Memory (top-left) -->
      <g transform="translate(-121,-70)">
        <circle r="22" fill="#0a0a1a" stroke="#06b6d4" stroke-width="1.4" filter="url(#b)"/>
        <circle r="14" fill="#06b6d4" opacity="0.3"/>
        <text text-anchor="middle" y="3" class="mono" font-size="9" fill="#06b6d4" font-weight="700">MM</text>
        <text text-anchor="middle" y="40" class="mono" font-size="9" fill="#cbd5e1">memory</text>
        <text text-anchor="middle" y="54" class="mono" font-size="8" fill="#64748b">long-term</text>
        <circle cx="22" cy="-22" r="3" fill="#10b981" class="pulse"/>
      </g>
    </g>

    <!-- Animated connections between agents -->
    <g stroke="url(#g1)" stroke-width="0.8" class="flow" fill="none" opacity="0.6">
      <line x1="0" y1="-140" x2="121" y2="-70"/>
      <line x1="121" y1="-70" x2="121" y2="70"/>
      <line x1="121" y1="70" x2="0" y2="140"/>
      <line x1="0" y1="140" x2="-121" y2="70"/>
      <line x1="-121" y1="70" x2="-121" y2="-70"/>
      <line x1="-121" y1="-70" x2="0" y2="-140"/>
    </g>

    <!-- Center: orchestrator -->
    <g>
      <circle r="30" fill="#0a0a1a" stroke="url(#g1)" stroke-width="1.4" filter="url(#b)"/>
      <circle r="20" fill="url(#g1)" opacity="0.3"/>
      <text text-anchor="middle" y="-2" class="mono" font-size="9" fill="#22d3ee" letter-spacing="3">CORE</text>
      <text text-anchor="middle" y="10" class="mono" font-size="8" fill="#a78bfa" letter-spacing="2">ORC</text>
      <circle r="5" fill="#22d3ee" class="pulse"/>
    </g>
  </g>

  <!-- Status strip -->
  <g transform="translate(40,330)" class="mono" font-size="9" fill="#64748b">
    <text>▸ AGENTS · 6 / 6 ONLINE</text>
    <text x="220">▸ MESSAGES · 1,247 TODAY</text>
    <text x="440">▸ TOOL CALLS · 312 TODAY</text>
    <text x="660">▸ LATENCY · 24ms P50</text>
    <text x="1120" text-anchor="end" fill="#22d3ee">● MESH HEALTHY</text>
  </g>
</svg>