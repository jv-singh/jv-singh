<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="JAIVARDHAN OS — boot sequence">
  <title>JAIVARDHAN OS · Boot Sequence</title>
  <defs>
    <!-- Backgrounds -->
    <radialGradient id="boot-bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Core glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Plasma ring -->
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="ring-grad-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Scan line -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter: bloom -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hex pattern -->
    <pattern id="hex" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 2 L56 17 L56 47 L30 62 L4 47 L4 17 Z" fill="none" stroke="#1e1b4b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif; }

      /* Rotating rings */
      .ring-1 { transform-origin: 600px 360px; animation: rot 22s linear infinite; }
      .ring-2 { transform-origin: 600px 360px; animation: rot-rev 18s linear infinite; }
      .ring-3 { transform-origin: 600px 360px; animation: rot 30s linear infinite; }

      @keyframes rot    { to { transform: rotate(360deg); } }
      @keyframes rot-rev{ to { transform: rotate(-360deg); } }

      /* Scan line sweep */
      .scanline {
        animation: scan 4.5s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(0); opacity: 0.0; }
        10%  { opacity: 0.8; }
        50%  { opacity: 0.6; }
        90%  { opacity: 0.8; }
        100% { transform: translateY(700px); opacity: 0; }
      }

      /* Typewriter line */
      .line { opacity: 0; animation: appear 0.4s ease-out forwards; }
      .line.l1 { animation-delay: 0.2s; }
      .line.l2 { animation-delay: 0.7s; }
      .line.l3 { animation-delay: 1.2s; }
      .line.l4 { animation-delay: 1.7s; }
      .line.l5 { animation-delay: 2.2s; }
      .line.l6 { animation-delay: 2.7s; }
      .line.l7 { animation-delay: 3.2s; }
      .line.l8 { animation-delay: 3.7s; }

      @keyframes appear {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Pulse core */
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 600px 360px; }
      @keyframes pulse {
        0%, 100% { transform: scale(1);   opacity: 0.9; }
        50%      { transform: scale(1.06); opacity: 1; }
      }

      /* Core reveal */
      .core-circle { animation: core-in 1.4s ease-out forwards; transform-origin: 600px 360px; }
      @keyframes core-in {
        from { transform: scale(0.4); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
      }

      /* Particles */
      .p1 { animation: float 6s ease-in-out infinite; }
      .p2 { animation: float 7s ease-in-out infinite; animation-delay: -1s; }
      .p3 { animation: float 8s ease-in-out infinite; animation-delay: -2s; }
      .p4 { animation: float 5.5s ease-in-out infinite; animation-delay: -3s; }
      .p5 { animation: float 7.5s ease-in-out infinite; animation-delay: -1.5s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.6; }
        50%      { transform: translateY(-12px); opacity: 1; }
      }

      /* Cursor blink */
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#boot-bg)"/>
  <rect width="1200" height="700" fill="url(#hex)"/>

  <!-- Ambient particles -->
  <g opacity="0.55">
    <circle class="p1" cx="120" cy="120" r="1.4" fill="#22d3ee"/>
    <circle class="p2" cx="1050" cy="180" r="1.2" fill="#a78bfa"/>
    <circle class="p3" cx="180" cy="540" r="1.6" fill="#10b981"/>
    <circle class="p4" cx="1080" cy="600" r="1.2" fill="#ec4899"/>
    <circle class="p5" cx="900" cy="100" r="1.4" fill="#6366f1"/>
    <circle class="p1" cx="320" cy="80" r="1" fill="#22d3ee"/>
    <circle class="p3" cx="780" cy="620" r="1.2" fill="#a78bfa"/>
    <circle class="p2" cx="60"  cy="350" r="1" fill="#10b981"/>
    <circle class="p4" cx="1140" cy="380" r="1" fill="#6366f1"/>
    <circle class="p5" cx="430" cy="640" r="1" fill="#ec4899"/>
  </g>

  <!-- Central core glow -->
  <circle cx="600" cy="360" r="280" fill="url(#core-glow)" opacity="0.5"/>

  <!-- Rotating rings -->
  <g class="ring-1" filter="url(#soft-glow)">
    <circle cx="600" cy="360" r="220" fill="none" stroke="url(#ring-grad)" stroke-width="1.2" stroke-dasharray="2 10" opacity="0.85"/>
    <circle cx="600" cy="360" r="220" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
    <!-- Tick marks on outer ring -->
    <g stroke="#22d3ee" stroke-width="1" opacity="0.7">
      <line x1="600" y1="130" x2="600" y2="142"/>
      <line x1="600" y1="578" x2="600" y2="590"/>
      <line x1="370" y1="360" x2="382" y2="360"/>
      <line x1="818" y1="360" x2="830" y2="360"/>
    </g>
  </g>

  <g class="ring-2" filter="url(#soft-glow)">
    <ellipse cx="600" cy="360" rx="170" ry="170" fill="none" stroke="url(#ring-grad-2)" stroke-width="1.4" opacity="0.9"/>
    <!-- Orbital nodes -->
    <g>
      <circle cx="770" cy="360" r="4" fill="#22d3ee" filter="url(#bloom)"/>
      <circle cx="430" cy="360" r="4" fill="#ec4899" filter="url(#bloom)"/>
    </g>
  </g>

  <g class="ring-3">
    <ellipse cx="600" cy="360" rx="120" ry="120" fill="none" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6"/>
  </g>

  <!-- Core orb -->
  <g class="core-circle">
    <circle class="pulse" cx="600" cy="360" r="80" fill="url(#core-glow)"/>
    <circle cx="600" cy="360" r="46" fill="#0d1117" stroke="url(#ring-grad)" stroke-width="1.4" filter="url(#bloom)"/>
    <text x="600" y="356" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="3">J.OS</text>
    <text x="600" y="376" text-anchor="middle" class="mono" font-size="9"  fill="#22d3ee" letter-spacing="2">v2.0.7</text>
  </g>

  <!-- Scan line -->
  <rect class="scanline" x="0" y="0" width="1200" height="80" fill="url(#scan)"/>

  <!-- Brand / Title -->
  <g transform="translate(600, 80)">
    <text text-anchor="middle" class="sans" font-size="11" letter-spacing="8" fill="#64748b">—  SYSTEM  —</text>
    <text y="22" text-anchor="middle" class="sans" font-size="32" font-weight="800" letter-spacing="14" fill="#e2e8f0" filter="url(#bloom)">JAIVARDHAN OS</text>
    <text y="44" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#22d3ee" opacity="0.9">// machine learning · agentic ai · operating system</text>
  </g>

  <!-- Bottom-left terminal log -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="540" height="130" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="20" rx="6" fill="#0d0d1a"/>
    <circle cx="12" cy="10" r="3" fill="#ef4444"/>
    <circle cx="24" cy="10" r="3" fill="#f59e0b"/>
    <circle cx="36" cy="10" r="3" fill="#10b981"/>
    <text x="56" y="14" class="mono" font-size="9" fill="#64748b">root@jaivardhan-os: ~/boot.log</text>

    <g transform="translate(12, 36)" class="mono" font-size="10">
      <text class="line l1" fill="#10b981">[ OK ] initializing neural substrate ............ <tspan fill="#22d3ee">42ms</tspan></text>
      <text class="line l2" y="14" fill="#10b981">[ OK ] loading agentic core v2.0.7 .............. <tspan fill="#22d3ee">118ms</tspan></text>
      <text class="line l3" y="28" fill="#10b981">[ OK ] mounting knowledge galaxy ................ <tspan fill="#22d3ee">67ms</tspan></text>
      <text class="line l4" y="42" fill="#10b981">[ OK ] calibrating mission compass .............. <tspan fill="#22d3ee">23ms</tspan></text>
      <text class="line l5" y="56" fill="#10b981">[ OK ] linking MCP / A2A protocols ............. <tspan fill="#22d3ee">55ms</tspan></text>
      <text class="line l6" y="70" fill="#a78bfa">[ ▶ ] handshaking with brain: jaivardhan ........ <tspan class="cursor" fill="#a78bfa">_</tspan></text>
    </g>
  </g>

  <!-- Bottom-right system stats -->
  <g transform="translate(640, 540)">
    <rect x="0" y="0" width="500" height="130" rx="6" fill="#06070d" stroke="#1e1b4b" stroke-width="1"/>
    <text x="14" y="22" class="mono" font-size="10" fill="#22d3ee" letter-spacing="2">▸ SYSTEM DIAGNOSTICS</text>

    <!-- Bar rows -->
    <g transform="translate(14, 36)" class="mono" font-size="9">
      <!-- CPU -->
      <text fill="#64748b">CPU</text>
      <text x="60" fill="#cbd5e1">neural-cores · 12 threads</text>
      <rect x="240" y="-8" width="200" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="240" y="-8" width="142" height="6" rx="3" fill="#22d3ee"/>
      <text x="448" fill="#22d3ee">71%</text>

      <text y="16" fill="#64748b">MEM</text>
      <text x="60" y="16" fill="#cbd5e1">curiosity · knowledge · grit</text>
      <rect x="240" y="8" width="200" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="240" y="8" width="184" height="6" rx="3" fill="#a78bfa"/>
      <text x="448" y="16" fill="#a78bfa">92%</text>

      <text y="32" fill="#64748b">GPU</text>
      <text x="60" y="32" fill="#cbd5e1">imagination renderer</text>
      <rect x="240" y="24" width="200" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="240" y="24" width="168" height="6" rx="3" fill="#ec4899"/>
      <text x="448" y="32" fill="#ec4899">84%</text>

      <text y="48" fill="#64748b">NET</text>
      <text x="60" y="48" fill="#cbd5e1">agent mesh · live</text>
      <rect x="240" y="40" width="200" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="240" y="40" width="156" height="6" rx="3" fill="#10b981"/>
      <text x="448" y="48" fill="#10b981">78%</text>

      <text y="64" fill="#64748b">SIG</text>
      <text x="60" y="64" fill="#cbd5e1">let&apos;s make it exist</text>
      <rect x="240" y="56" width="200" height="6" rx="3" fill="#0d0d1a"/>
      <rect x="240" y="56" width="196" height="6" rx="3" fill="#f59e0b"/>
      <text x="448" y="64" fill="#f59e0b">98%</text>
    </g>
  </g>

  <!-- HUD corners -->
  <g stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7">
    <path d="M30 30 L30 60 M30 30 L60 30"/>
    <path d="M1170 30 L1170 60 M1170 30 L1140 30"/>
    <path d="M30 670 L30 640 M30 670 L60 670"/>
    <path d="M1170 670 L1170 640 M1170 670 L1140 670"/>
  </g>
  <g class="mono" font-size="9" fill="#22d3ee" opacity="0.7">
    <text x="36" y="26">[+]</text>
    <text x="1164" y="26" text-anchor="end">JAIVARDHAN//OS</text>
    <text x="36" y="688">2026.07.30 · 12:00 IST</text>
    <text x="1164" y="688" text-anchor="end">USER · JAIVARDHAN_S</text>
  </g>
</svg>
