<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Memory Vault — Knowledge Map">
  <title>Memory Vault</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#020617"/></radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .flow { stroke-dasharray: 4 6; animation: f 4s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="280" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ MEMORY VAULT · KNOWLEDGE NODES</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">3 CORES · 12 NODES</text>

  <!-- 3 vaults -->
  <g transform="translate(180,180)">
    <circle r="100" fill="url(#g1)" class="pulse"/>
    <circle r="60" fill="none" stroke="#22d3ee" stroke-width="1.4" filter="url(#b)"/>
    <text text-anchor="middle" y="-4" class="mono" font-size="10" fill="#22d3ee" letter-spacing="3">SHORT</text>
    <text text-anchor="middle" y="10" class="mono" font-size="10" fill="#22d3ee" letter-spacing="3">TERM</text>
    <text text-anchor="middle" y="80" class="mono" font-size="9" fill="#94a3b8">working memory · context</text>
    <!-- nodes around -->
    <g class="mono" font-size="8" fill="#cbd5e1" text-anchor="middle">
      <g transform="translate(0,-100)"><circle r="6" fill="#22d3ee"/><text y="14">conv</text></g>
      <g transform="translate(80,-60)"><circle r="6" fill="#22d3ee"/><text x="-20" y="3">task</text></g>
      <g transform="translate(-80,-60)"><circle r="6" fill="#22d3ee"/><text x="20" y="3">goal</text></g>
      <g transform="translate(80,60)"><circle r="6" fill="#22d3ee"/><text x="-20" y="3">todo</text></g>
      <g transform="translate(-80,60)"><circle r="6" fill="#22d3ee"/><text x="20" y="3">plan</text></g>
    </g>
  </g>

  <g transform="translate(600,180)">
    <circle r="100" fill="url(#g2)" class="pulse"/>
    <circle r="60" fill="none" stroke="#a78bfa" stroke-width="1.4" filter="url(#b)"/>
    <text text-anchor="middle" y="-4" class="mono" font-size="10" fill="#a78bfa" letter-spacing="3">EPISODIC</text>
    <text text-anchor="middle" y="10" class="mono" font-size="10" fill="#a78bfa" letter-spacing="3">MEMORY</text>
    <text text-anchor="middle" y="80" class="mono" font-size="9" fill="#94a3b8">experiences · past runs</text>
    <g class="mono" font-size="8" fill="#cbd5e1" text-anchor="middle">
      <g transform="translate(0,-100)"><circle r="6" fill="#a78bfa"/><text y="14">logs</text></g>
      <g transform="translate(80,-60)"><circle r="6" fill="#a78bfa"/><text x="-20" y="3">trace</text></g>
      <g transform="translate(-80,-60)"><circle r="6" fill="#a78bfa"/><text x="20" y="3">tools</text></g>
      <g transform="translate(80,60)"><circle r="6" fill="#a78bfa"/><text x="-20" y="3">calls</text></g>
      <g transform="translate(-80,60)"><circle r="6" fill="#a78bfa"/><text x="20" y="3">runs</text></g>
    </g>
  </g>

  <g transform="translate(1020,180)">
    <circle r="100" fill="url(#g3)" class="pulse"/>
    <circle r="60" fill="none" stroke="#ec4899" stroke-width="1.4" filter="url(#b)"/>
    <text text-anchor="middle" y="-4" class="mono" font-size="10" fill="#ec4899" letter-spacing="3">SEMANTIC</text>
    <text text-anchor="middle" y="10" class="mono" font-size="10" fill="#ec4899" letter-spacing="3">MEMORY</text>
    <text text-anchor="middle" y="80" class="mono" font-size="9" fill="#94a3b8">facts · patterns · knowledge</text>
    <g class="mono" font-size="8" fill="#cbd5e1" text-anchor="middle">
      <g transform="translate(0,-100)"><circle r="6" fill="#ec4899"/><text y="14">docs</text></g>
      <g transform="translate(80,-60)"><circle r="6" fill="#ec4899"/><text x="-20" y="3">rules</text></g>
      <g transform="translate(-80,-60)"><circle r="6" fill="#ec4899"/><text x="20" y="3">embed</text></g>
      <g transform="translate(80,60)"><circle r="6" fill="#ec4899"/><text x="-20" y="3">graph</text></g>
      <g transform="translate(-80,60)"><circle r="6" fill="#ec4899"/><text x="20" y="3">skill</text></g>
    </g>
  </g>

  <!-- Connections between vaults -->
  <g stroke="#a78bfa" stroke-width="0.6" stroke-dasharray="4 6" class="flow" fill="none" opacity="0.5">
    <path d="M280 180 Q400 100 540 180"/>
    <path d="M660 180 Q780 260 920 180"/>
  </g>

  <text x="40" y="290" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ 3-TIER MEMORY · short · episodic · semantic</text>
  <text x="1160" y="290" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">● ALL TIERS ACTIVE</text>
</svg>