<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Footer — Let&apos;s Make It Exist">
  <title>Footer — Let&apos;s Make It Exist</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="280" fill="#020617" rx="8"/>
  <rect x="20" y="20" width="1160" height="240" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <!-- Big motto -->
  <g transform="translate(600,140)">
    <text text-anchor="middle" class="sans" font-size="14" letter-spacing="14" fill="#64748b">— END OF LINE —</text>
    <text y="58" text-anchor="middle" class="sans" font-size="56" font-weight="900" fill="url(#title)" filter="url(#b)" letter-spacing="-1">LET&apos;S MAKE IT EXIST.</text>
    <text y="92" text-anchor="middle" class="mono" font-size="11" fill="#22d3ee" letter-spacing="6">github.com/jv-singh · jaivardhan singh · 2026</text>
    <g transform="translate(0,140)" class="mono" font-size="9" fill="#64748b" text-anchor="middle">
      <text>★  this repo · 🧠  ml systems · ⚡  agentic · 🚀  build in public</text>
    </g>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#bg)" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M40 40 L40 80 M40 40 L80 40"/>
    <path d="M1160 40 L1160 80 M1160 40 L1120 40"/>
    <path d="M40 240 L40 200 M40 240 L80 240"/>
    <path d="M1160 240 L1160 200 M1160 240 L1120 240"/>
  </g>

  <!-- Status pill -->
  <g transform="translate(600,40)">
    <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#0d0d1a" stroke="#22d3ee"/>
    <circle cx="-60" cy="0" r="4" fill="#22d3ee" class="pulse"/>
    <text x="-46" y="4" class="mono" font-size="10" fill="#22d3ee" letter-spacing="3">SYSTEM ONLINE</text>
  </g>
</svg>