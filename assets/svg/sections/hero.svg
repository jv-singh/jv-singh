<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-label="JAIVARDHAN OS · hero HUD">
  <title>JAIVARDHAN OS · Hero HUD</title>
  <defs>
    <linearGradient id="hud-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="hud-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hud-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="hud-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1b4b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif; }

      .spin   { animation: rot 20s linear infinite; transform-origin: 700px 230px; }
      .spin-r { animation: rot 14s linear infinite reverse; transform-origin: 700px 230px; }
      @keyframes rot { to { transform: rotate(360deg); } }

      .pulse  { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

      .dash   { stroke-dasharray: 4 6; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -100; } }

      .ring-glow { filter: url(#hud-bloom); }

      .fade-in { opacity: 0; animation: fadein 1.2s ease-out forwards; }
      .d1 { animation-delay: 0.1s; }
      .d2 { animation-delay: 0.4s; }
      .d3 { animation-delay: 0.7s; }
      .d4 { animation-delay: 1.0s; }
      .d5 { animation-delay: 1.3s; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="460" fill="url(#hud-bg)"/>
  <rect width="1400" height="460" fill="url(#grid)"/>
  <ellipse cx="700" cy="230" rx="600" ry="200" fill="url(#hud-spot)"/>

  <!-- HUD frame -->
  <g class="fade-in d1" stroke="url(#hud-stroke)" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M20 20 L20 80 M20 20 L80 20"/>
    <path d="M1380 20 L1380 80 M1380 20 L1320 20"/>
    <path d="M20 440 L20 380 M20 440 L80 440"/>
    <path d="M1380 440 L1380 380 M1380 440 L1320 440"/>
    <line x1="20" y1="20" x2="1380" y2="20" opacity="0.3"/>
    <line x1="20" y1="440" x2="1380" y2="440" opacity="0.3"/>
  </g>

  <!-- Top status row -->
  <g class="fade-in d1" class="mono">
    <text x="40" y="48" class="mono" font-size="10" fill="#22d3ee" letter-spacing="3">▸ JAIVARDHAN//OS · v2.0.7 · NEURAL_BUILD</text>
    <text x="1360" y="48" text-anchor="end" class="mono" font-size="10" fill="#22d3ee" letter-spacing="2">UPLINK · 12.4 GB/s · MESH · LIVE</text>
  </g>

  <!-- Center orbit -->
  <g class="fade-in d2" transform="translate(700,230)">
    <g class="spin">
      <circle r="170" fill="none" stroke="url(#hud-stroke)" stroke-width="1" stroke-dasharray="1 8" opacity="0.8"/>
      <!-- satellites -->
      <g>
        <circle cx="170" cy="0" r="5" fill="#22d3ee" filter="url(#hud-bloom)"/>
        <circle cx="-170" cy="0" r="4" fill="#ec4899" filter="url(#hud-bloom)"/>
        <circle cx="0"   cy="170" r="3" fill="#10b981" filter="url(#hud-bloom)"/>
        <circle cx="0"   cy="-170" r="4" fill="#a78bfa" filter="url(#hud-bloom)"/>
      </g>
    </g>
    <g class="spin-r">
      <circle r="130" fill="none" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.7"/>
      <circle r="100" fill="none" stroke="#22d3ee" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Core brain -->
    <g class="ring-glow">
      <circle r="68" fill="#0a0a1a" stroke="url(#hud-stroke)" stroke-width="1.4"/>
      <circle r="58" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/>
      <g stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.9">
        <path d="M-30 -10 Q-10 -30 10 -20 Q30 -10 25 15 Q15 35 -10 30 Q-30 25 -32 5 Z"/>
        <path d="M-22 0 Q-10 -16 0 -10 Q10 -4 6 8 Q0 18 -12 14 Q-22 8 -22 0 Z" fill="#8b5cf6" fill-opacity="0.15"/>
      </g>
      <text y="6" text-anchor="middle" class="mono" font-size="9" fill="#22d3ee" letter-spacing="3" class="pulse">CORE</text>
    </g>
  </g>

  <!-- Left column — identity -->
  <g class="fade-in d3" transform="translate(60, 110)">
    <text class="mono" font-size="10" fill="#64748b" letter-spacing="3">▌ IDENTITY</text>
    <text y="44" class="sans" font-size="56" font-weight="800" fill="url(#name-grad)" filter="url(#hud-bloom)" letter-spacing="-1">JAIVARDHAN</text>
    <text y="80" class="sans" font-size="22" font-weight="300" fill="#cbd5e1" letter-spacing="14">S I N G H</text>

    <g transform="translate(0,110)">
      <rect x="0" y="0" width="14" height="14" fill="#22d3ee" filter="url(#hud-bloom)"/>
      <text x="24" y="12" class="mono" font-size="11" fill="#22d3ee" letter-spacing="2">MACHINE LEARNING ENGINEER</text>
    </g>
    <text y="142" class="mono" font-size="11" fill="#94a3b8">// agentic systems · RAG · multi-agent orchestration</text>

    <g transform="translate(0,170)">
      <text class="mono" font-size="9" fill="#64748b">LOCATION</text>
      <text y="14" class="mono" font-size="11" fill="#cbd5e1">NOIDA · IN · IST</text>
    </g>
    <g transform="translate(160,170)">
      <text class="mono" font-size="9" fill="#64748b">FOCUS</text>
      <text y="14" class="mono" font-size="11" fill="#cbd5e1">AGENTIC AI</text>
    </g>
    <g transform="translate(320,170)">
      <text class="mono" font-size="9" fill="#64748b">STATUS</text>
      <text y="14" class="mono" font-size="11" fill="#10b981">● SHIPPING</text>
    </g>
  </g>

  <!-- Right column — HUD stats -->
  <g class="fade-in d4" transform="translate(900, 100)">
    <text class="mono" font-size="10" fill="#64748b" letter-spacing="3">▌ TELEMETRY</text>

    <g transform="translate(0,30)">
      <!-- Stat card 1 -->
      <rect x="0" y="0" width="220" height="80" rx="6" fill="#06070d" stroke="#1e1b4b"/>
      <text x="14" y="22" class="mono" font-size="9" fill="#64748b" letter-spacing="2">CONSCIOUSNESS</text>
      <text x="14" y="56" class="mono" font-size="26" font-weight="700" fill="#22d3ee" filter="url(#hud-bloom)">96<tspan font-size="14" fill="#64748b">/100</tspan></text>
      <rect x="14" y="64" width="190" height="4" rx="2" fill="#0d0d1a"/>
      <rect x="14" y="64" width="184" height="4" rx="2" fill="#22d3ee" filter="url(#hud-bloom)"/>

      <!-- Stat card 2 -->
      <rect x="240" y="0" width="220" height="80" rx="6" fill="#06070d" stroke="#1e1b4b"/>
      <text x="254" y="22" class="mono" font-size="9" fill="#64748b" letter-spacing="2">INNOVATION RADAR</text>
      <text x="254" y="56" class="mono" font-size="26" font-weight="700" fill="#a78bfa" filter="url(#hud-bloom)">A+</text>
      <text x="310" y="56" class="mono" font-size="9" fill="#64748b">SCAN COMPLETE</text>
      <g transform="translate(254,72)">
        <rect width="190" height="3" rx="1.5" fill="#0d0d1a"/>
        <rect width="178" height="3" rx="1.5" fill="#a78bfa"/>
      </g>
    </g>

    <g transform="translate(0,130)">
      <rect x="0" y="0" width="460" height="100" rx="6" fill="#06070d" stroke="#1e1b4b"/>
      <text x="14" y="22" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ LIVE ACTIVITY · LAST 24H</text>

      <!-- Mini graph -->
      <g transform="translate(14,40)" stroke="#22d3ee" stroke-width="1.4" fill="none" filter="url(#hud-bloom)">
        <polyline class="dash" points="0,40 30,30 60,35 90,20 120,28 150,12 180,22 210,8 240,18 270,10 300,16 330,4 360,12 390,8 420,16"/>
        <polyline points="0,40 30,30 60,35 90,20 120,28 150,12 180,22 210,8 240,18 270,10 300,16 330,4 360,12 390,8 420,16" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g class="mono" font-size="9" fill="#64748b">
        <text x="14" y="92">00:00</text>
        <text x="220" y="92" text-anchor="middle">12:00</text>
        <text x="438" y="92" text-anchor="end">NOW</text>
      </g>
    </g>
  </g>

  <!-- Bottom bar — quote / motto -->
  <g class="fade-in d5" transform="translate(60, 320)">
    <rect x="0" y="0" width="1280" height="50" rx="6" fill="#06070d" stroke="#1e1b4b"/>
    <rect x="0" y="0" width="4" height="50" fill="url(#hud-stroke)"/>
    <text x="22" y="20" class="mono" font-size="9" fill="#64748b" letter-spacing="3">▌ CORE MOTTO</text>
    <text x="22" y="40" class="sans" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="2">"Let&apos;s make it exist." <tspan fill="#22d3ee">— engineering imagination into reliable systems.</tspan></text>
  </g>

  <!-- Bottom HUD strip — agent activity ticker -->
  <g class="fade-in d5" transform="translate(60, 384)">
    <text class="mono" font-size="9" fill="#64748b" letter-spacing="2">▌ AGENT MESH</text>
    <g transform="translate(110,-6)">
      <rect x="0"   y="0" width="14" height="14" fill="#22d3ee" filter="url(#hud-bloom)"/>
      <text x="20" y="11" class="mono" font-size="9" fill="#cbd5e1">researcher</text>
      <rect x="100" y="0" width="14" height="14" fill="#a78bfa" filter="url(#hud-bloom)"/>
      <text x="120" y="11" class="mono" font-size="9" fill="#cbd5e1">architect</text>
      <rect x="200" y="0" width="14" height="14" fill="#ec4899" filter="url(#hud-bloom)"/>
      <text x="220" y="11" class="mono" font-size="9" fill="#cbd5e1">builder</text>
      <rect x="290" y="0" width="14" height="14" fill="#10b981" filter="url(#hud-bloom)"/>
      <text x="310" y="11" class="mono" font-size="9" fill="#cbd5e1">critic</text>
      <rect x="370" y="0" width="14" height="14" fill="#f59e0b" filter="url(#hud-bloom)"/>
      <text x="390" y="11" class="mono" font-size="9" fill="#cbd5e1">deployer</text>
      <rect x="470" y="0" width="14" height="14" fill="#06b6d4" filter="url(#hud-bloom)"/>
      <text x="490" y="11" class="mono" font-size="9" fill="#cbd5e1">memory</text>
    </g>
    <text x="1280" y="6" text-anchor="end" class="mono" font-size="10" fill="#22d3ee">●  6 AGENTS · COORDINATED</text>
  </g>
</svg>
