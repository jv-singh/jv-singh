<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="Live Goals Bar">
  <title>Live Goals</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0a0a1a"/></linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="200" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ LIVE GOALS · 2026 MISSION</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">TRACKING  ·  IN PROGRESS</text>

  <!-- Goal 1 -->
  <g transform="translate(40,80)" class="mono">
    <text font-size="10" fill="#22d3ee">▸ SHIP FLAGSHIP AGENTIC AI OSS</text>
    <text x="1120" text-anchor="end" font-size="10" fill="#22d3ee">72%</text>
    <rect y="10" width="1120" height="10" rx="5" fill="#0d0d1a"/>
    <rect y="10" width="806" height="10" rx="5" fill="url(#bar1)" filter="url(#b)"/>
    <text y="40" font-size="9" fill="#64748b">public release · multi-agent framework · MIT</text>
  </g>

  <!-- Goal 2 -->
  <g transform="translate(40,140)" class="mono">
    <text font-size="10" fill="#a78bfa">▸ PUBLISH MULTI-AGENT PAPER</text>
    <text x="1120" text-anchor="end" font-size="10" fill="#a78bfa">48%</text>
    <rect y="10" width="1120" height="10" rx="5" fill="#0d0d1a"/>
    <rect y="10" width="538" height="10" rx="5" fill="url(#bar2)" filter="url(#b)"/>
    <text y="40" font-size="9" fill="#64748b">drafting · arxiv target · benchmarks</text>
  </g>

  <!-- Goal 3 -->
  <g transform="translate(40,200)" class="mono">
    <text font-size="10" fill="#ec4899">▸ MENTOR 3 JUNIOR ENGINEERS</text>
    <text x="1120" text-anchor="end" font-size="10" fill="#ec4899">33%</text>
    <rect y="-180" width="1120" height="6" rx="3" fill="#0d0d1a"/>
    <rect y="-180" width="370" height="6" rx="3" fill="url(#bar3)" filter="url(#b)"/>
  </g>
</svg>