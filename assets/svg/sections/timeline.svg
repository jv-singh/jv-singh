<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Career Timeline">
  <title>Career Timeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0a0a1a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="33%" stop-color="#a78bfa"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .flow { animation: f 3s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="280" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ CAREER TIMELINE · MISSION TRAJECTORY</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">2023 → 2027+</text>

  <!-- Timeline rail -->
  <g transform="translate(80,160)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e1b4b" stroke-width="2"/>
    <line x1="0" y1="0" x2="1040" y2="0" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 6" class="flow" filter="url(#b)"/>

    <!-- Node 1: 2023 — Research Intern -->
    <g transform="translate(80,0)">
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#22d3ee" stroke-width="0.6" stroke-dasharray="2 3"/>
      <g transform="translate(0,-50)" filter="url(#b)">
        <rect x="-100" y="-70" width="200" height="60" rx="4" fill="#06070d" stroke="#22d3ee"/>
        <text class="mono" font-size="9" x="-90" y="-50" fill="#22d3ee">2023</text>
        <text class="sans" font-size="11" x="-90" y="-36" font-weight="700" fill="#cbd5e1">Data Research Intern</text>
        <text class="mono" font-size="9" x="-90" y="-22" fill="#94a3b8">Saakshar Hum Foundation</text>
      </g>
      <circle r="8" fill="#22d3ee" filter="url(#b)"/>
      <circle r="3" fill="#fff"/>
    </g>

    <!-- Node 2: 2024 — DS Intern -->
    <g transform="translate(290,0)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#a78bfa" stroke-width="0.6" stroke-dasharray="2 3"/>
      <g transform="translate(0,50)" filter="url(#b)">
        <rect x="-90" y="10" width="180" height="60" rx="4" fill="#06070d" stroke="#a78bfa"/>
        <text class="mono" font-size="9" x="-80" y="30" fill="#a78bfa">2024</text>
        <text class="sans" font-size="11" x="-80" y="46" font-weight="700" fill="#cbd5e1">Data Science Intern</text>
        <text class="mono" font-size="9" x="-80" y="60" fill="#94a3b8">Celebal Technologies</text>
      </g>
      <circle r="8" fill="#a78bfa" filter="url(#b)"/>
      <circle r="3" fill="#fff"/>
    </g>

    <!-- Node 3: 2024 — AI Engineer -->
    <g transform="translate(500,0)">
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#ec4899" stroke-width="0.6" stroke-dasharray="2 3"/>
      <g transform="translate(0,-50)" filter="url(#b)">
        <rect x="-100" y="-70" width="200" height="60" rx="4" fill="#06070d" stroke="#ec4899"/>
        <text class="mono" font-size="9" x="-90" y="-50" fill="#ec4899">2024 → 2025</text>
        <text class="sans" font-size="11" x="-90" y="-36" font-weight="700" fill="#cbd5e1">AI Engineer Intern</text>
        <text class="mono" font-size="9" x="-90" y="-22" fill="#94a3b8">LifeAtlas · Multi-Agent</text>
      </g>
      <circle r="8" fill="#ec4899" filter="url(#b)"/>
      <circle r="3" fill="#fff"/>
    </g>

    <!-- Node 4: 2025 — ML Engineer (CURRENT) -->
    <g transform="translate(720,0)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#10b981" stroke-width="0.6" stroke-dasharray="2 3"/>
      <g transform="translate(0,50)" filter="url(#b)">
        <rect x="-100" y="10" width="200" height="64" rx="4" fill="#06070d" stroke="#10b981" stroke-width="1.4"/>
        <text class="mono" font-size="9" x="-90" y="30" fill="#10b981">2025 → present · LIVE</text>
        <text class="sans" font-size="11" x="-90" y="46" font-weight="700" fill="#cbd5e1">ML Engineer Intern</text>
        <text class="mono" font-size="9" x="-90" y="60" fill="#94a3b8">Redrob · McKinley Rice</text>
        <circle cx="92" cy="32" r="4" fill="#10b981" class="pulse"/>
      </g>
      <circle r="10" fill="#10b981" filter="url(#b)" class="pulse"/>
      <circle r="4" fill="#fff"/>
    </g>

    <!-- Node 5: 2027 — Future -->
    <g transform="translate(960,0)">
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2 3"/>
      <g transform="translate(0,-50)">
        <rect x="-80" y="-70" width="160" height="60" rx="4" fill="#06070d" stroke="#f59e0b" stroke-dasharray="4 4"/>
        <text class="mono" font-size="9" x="-70" y="-50" fill="#f59e0b">2027 → FUTURE</text>
        <text class="sans" font-size="11" x="-70" y="-36" font-weight="700" fill="#cbd5e1">Top AI Team</text>
        <text class="mono" font-size="9" x="-70" y="-22" fill="#94a3b8">full-time engineer</text>
      </g>
      <circle r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <circle r="3" fill="#f59e0b" class="pulse"/>
    </g>
  </g>

  <!-- Education marker -->
  <g transform="translate(80,290)" class="mono" font-size="9" fill="#64748b">
    <text>▌ EDU · Amity University · B.Tech Data Science · 2023 → 2027</text>
  </g>
</svg>