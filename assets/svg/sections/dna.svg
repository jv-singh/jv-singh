<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Digital DNA — Source Code Genome">
  <title>JAIVARDHAN OS · Digital DNA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0a0a1a"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .pulse { animation: p 2s ease-in-out infinite; transform-origin: center; }
      @keyframes p { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .flow { stroke-dasharray: 6 8; animation: f 4s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -200; } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="1160" height="240" rx="6" fill="#06070d" stroke="#1e1b4b"/>

  <text x="40" y="50" class="mono" font-size="11" fill="#22d3ee" letter-spacing="3">▸ DIGITAL DNA · SOURCE CODE GENOME</text>
  <text x="1160" y="50" text-anchor="end" class="mono" font-size="9" fill="#64748b">2 HELICES · 4 BASES</text>

  <g transform="translate(600,140)">
    <!-- Two intertwined helix strands -->
    <g stroke="url(#g1)" stroke-width="2" fill="none" filter="url(#b)">
      <path d="M -360 -80 Q -320 -80 -300 -40 Q -280 0 -260 -40 Q -240 -80 -200 -80"/>
      <path d="M -180 -40 Q -160 -80 -140 -40 Q -120 0 -100 -40 Q -80 -80 -60 -40 Q -40 0 -20 -40"/>
      <path d="M 40 -80 Q 60 -40 80 -80 Q 100 -120 120 -80 Q 140 -40 160 -80"/>
      <path d="M 200 -40 Q 220 0 240 -40 Q 260 -80 280 -40 Q 300 0 320 -40 Q 340 -80 360 -40"/>
    </g>

    <g stroke="url(#g2)" stroke-width="2" fill="none" filter="url(#b)">
      <path d="M -360 80 Q -320 80 -300 40 Q -280 0 -260 40 Q -240 80 -200 80"/>
      <path d="M -180 40 Q -160 80 -140 40 Q -120 0 -100 40 Q -80 80 -60 40 Q -40 0 -20 40"/>
      <path d="M 40 80 Q 60 40 80 80 Q 100 120 120 80 Q 140 40 160 80"/>
      <path d="M 200 40 Q 220 0 240 40 Q 260 80 280 40 Q 300 0 320 40 Q 340 80 360 40"/>
    </g>

    <!-- Cross-bars (rungs) -->
    <g stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2 3" class="flow" opacity="0.5">
      <line x1="-340" y1="-65" x2="-340" y2="65"/>
      <line x1="-300" y1="-55" x2="-300" y2="55"/>
      <line x1="-260" y1="-50" x2="-260" y2="50"/>
      <line x1="-220" y1="-65" x2="-220" y2="65"/>
      <line x1="-180" y1="-55" x2="-180" y2="55"/>
      <line x1="-140" y1="-50" x2="-140" y2="50"/>
      <line x1="-100" y1="-55" x2="-100" y2="55"/>
      <line x1="-60" y1="-50" x2="-60" y2="50"/>
      <line x1="0" y1="-65" x2="0" y2="65"/>
      <line x1="60" y1="-50" x2="60" y2="50"/>
      <line x1="120" y1="-65" x2="120" y2="65"/>
      <line x1="180" y1="-55" x2="180" y2="55"/>
      <line x1="240" y1="-50" x2="240" y2="50"/>
      <line x1="300" y1="-65" x2="300" y2="65"/>
    </g>

    <!-- Nucleotide nodes -->
    <g fill="#22d3ee" filter="url(#b)">
      <circle cx="-340" cy="-65" r="3"/>
      <circle cx="-220" cy="-65" r="3"/>
      <circle cx="-100" cy="-55" r="3"/>
      <circle cx="60" cy="-50" r="3"/>
      <circle cx="180" cy="-55" r="3"/>
      <circle cx="300" cy="-65" r="3"/>
    </g>
    <g fill="#a78bfa" filter="url(#b)">
      <circle cx="-300" cy="55" r="3"/>
      <circle cx="-180" cy="55" r="3"/>
      <circle cx="-60" cy="50" r="3"/>
      <circle cx="120" cy="65" r="3"/>
      <circle cx="240" cy="50" r="3"/>
    </g>
    <g fill="#ec4899" filter="url(#b)">
      <circle cx="-260" cy="50" r="3"/>
      <circle cx="-140" cy="50" r="3"/>
      <circle cx="0" cy="65" r="3"/>
      <circle cx="120" cy="-65" r="3"/>
      <circle cx="280" cy="-50" r="3"/>
    </g>
  </g>

  <text x="40" y="240" class="mono" font-size="9" fill="#64748b" letter-spacing="2">▸ 4 BASES · A (cyan) · G (violet) · C (pink) · T (emerald) · 1,247 LOCI · 142K BP</text>
  <text x="1160" y="240" text-anchor="end" class="mono" font-size="9" fill="#22d3ee">● GENOME STABLE</text>
</svg>