<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Jaivardhan Singh — Machine Learning Engineer">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Aurora glow -->
    <radialGradient id="aurora1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="60%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="motto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#aurora1)"/>
  <rect width="1200" height="400" fill="url(#aurora2)"/>
  <rect width="1200" height="400" fill="url(#aurora3)"/>

  <!-- Decorative orbs -->
  <circle cx="120" cy="80" r="3" fill="#6366f1" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1080" cy="320" r="2" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
  <circle cx="950" cy="60" r="2.5" fill="#ec4899" opacity="0.7" filter="url(#glow)"/>
  <circle cx="200" cy="340" r="2" fill="#3b82f6" opacity="0.7" filter="url(#glow)"/>
  <circle cx="600" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Top label -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94a3b8" letter-spacing="2">SYSTEM.ONLINE</text>
  </g>

  <!-- Main title -->
  <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="72" font-weight="800" fill="url(#title)" filter="url(#softGlow)" letter-spacing="-2">Jaivardhan Singh</text>

  <!-- Subtitle -->
  <text x="80" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#cbd5e1" letter-spacing="3">MACHINE LEARNING · GENAI · AGENTIC AI</text>

  <!-- Underline -->
  <line x1="80" y1="245" x2="220" y2="245" stroke="url(#motto)" stroke-width="2" stroke-linecap="round"/>

  <!-- Motto -->
  <text x="80" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="600" fill="url(#motto)" filter="url(#glow)">"Let's Make It Exist."</text>

  <!-- Right side info card -->
  <g transform="translate(820, 100)">
    <rect x="0" y="0" width="300" height="200" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="300" height="200" rx="16" fill="rgba(255,255,255,0.02)"/>

    <!-- Status row -->
    <circle cx="24" cy="32" r="4" fill="#10b981">
      <animate attributeName="r" values="4;5;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="36" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">AVAILABLE FOR IMPACT</text>

    <line x1="20" y1="56" x2="280" y2="56" stroke="rgba(148,163,184,0.15)"/>

    <text x="24" y="84" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">LOCATION</text>
    <text x="24" y="104" font-family="-apple-system, sans-serif" font-size="15" fill="#e2e8f0" font-weight="500">Noida, India 🇮🇳</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">FOCUS</text>
    <text x="24" y="152" font-family="-apple-system, sans-serif" font-size="15" fill="#e2e8f0" font-weight="500">Agentic AI · RAG · LLMs</text>

    <text x="24" y="180" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">EDUCATION</text>
    <text x="160" y="180" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="500">B.Tech Data Science · 2027</text>
  </g>

  <!-- Bottom divider line -->
  <line x1="80" y1="350" x2="1120" y2="350" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="80" y="375" font-family="ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">~/jv-singh</text>
  <text x="1100" y="375" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">v2.0.26</text>
</svg>
